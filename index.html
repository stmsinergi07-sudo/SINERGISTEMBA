    <script type="module">
        const IS_PREVIEW = false;

        const firebaseConfig = {
            apiKey: "AIzaSyDBDyPoXj0toZ3poge6y9kcqEKFMjFlRWo", 
            authDomain: "sinergi-ppdb.firebaseapp.com", 
            projectId: "sinergi-ppdb",

            messagingSenderId: "724940886839",

        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sinergi-spmb';

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, getDocs, setDoc, deleteDoc, onSnapshot, collection, query, where, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let db, auth;
        if (!IS_PREVIEW) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        }

        // Plugin Global Chart.js untuk Menampilkan Angka Statistik di Tengah Doughnut Chart
        const doughnutCenterTextPlugin = {
            id: 'doughnutCenterText',
            beforeDraw(chart) {
                if (chart.config.type !== 'doughnut') return;
                const { ctx, chartArea } = chart;
                if (!chartArea) return;
                const dataset = chart.data.datasets[0];
                if (!dataset || !dataset.data) return;
                const total = dataset.data.reduce((acc, val) => acc + (Number(val) || 0), 0);

                ctx.save();
                const centerX = (chartArea.left + chartArea.right) / 2;
                const centerY = (chartArea.top + chartArea.bottom) / 2;

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = '900 24px Inter, sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(total.toString(), centerX, centerY - 7);

                ctx.font = '700 9px Inter, sans-serif';
                ctx.fillStyle = '#9ca3af';
                const subLabel = chart.config.options?.plugins?.doughnutCenterText?.label || 'SISWA';
                ctx.fillText(subLabel, centerX, centerY + 13);
                ctx.restore();
            }
        };

        // Plugin Global Chart.js untuk Menampilkan Angka Langsung di Atas Batang Grafik
        const inlineValueLabelPlugin = {
            id: 'inlineValueLabel',
            afterDatasetsDraw(chart) {
                if (chart.config.type !== 'bar') return;
                const { ctx } = chart;
                chart.data.datasets.forEach((dataset, i) => {
                    const meta = chart.getDatasetMeta(i);
                    if (!meta || meta.hidden) return;
                    meta.data.forEach((element, index) => {
                        const value = dataset.data[index];
                        if (value === null || value === undefined || value === 0) return;
                        ctx.save();
                        ctx.fillStyle = '#f3f4f6';
                        ctx.font = '800 11px Inter, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        const pos = element.tooltipPosition();
                        ctx.fillText(String(value), pos.x, pos.y - 4);
                        ctx.restore();
                    });
                });
            }
        };

        if (typeof Chart !== 'undefined') {
            Chart.register(doughnutCenterTextPlugin, inlineValueLabelPlugin);
        }

        const SERAGAM_SIZES = ['L', 'XL', 'XXL', 'XXXL', 'JUMBO'];
        const DEFAULT_WA_GLOBAL = 'https://chat.whatsapp.com/KTxEAzJ7UTo7Q1g2LqiGFh?s=qt&p=a&iam=2';
        const DEFAULT_INFO_BOARD = {
            isActive: true,
            title: 'INFORMASI PENTING PENDAFTARAN SPMB',
            content: '1. Pastikan mengisi NISN (10 digit) dan NIK (16 digit) sesuai dokumen resmi (Ijazah/KK).\n2. Pilihan Jurusan 1 dan Pilihan Jurusan 2 wajib diisi dan tidak boleh sama.\n3. Setelah selesai mendaftar, harap simpan Nomor Pendaftaran Anda dan cetak Bukti Pendaftaran.\n4. Gunakan Nomor Pendaftaran sebagai Username dan Nama Ibu Kandung sebagai Password untuk Login.',
            updatedAt: 0
        };

        const state = {
            role: localStorage.getItem('spmb_role') || null, 
            siswaId: localStorage.getItem('spmb_siswaId') || null, 
            gelombang: [], jurusan: [], guru: [], siswa: [], siswaTrash: [], allSiswaRaw: [],
            isDataLoaded: false,
            settings: { 
                staffAccounts: { 
                    finance: { user: 'finance', pass: '2027' }, 
                    seragam: { user: 'seragam', pass: '2027' },
                    admin_office: { user: 'office', pass: '2027' }
                }, 
                waLinkGlobal: DEFAULT_WA_GLOBAL,
                infoBoard: DEFAULT_INFO_BOARD
            },
            theme: localStorage.getItem('theme') || 'light'
        };

        window.saveSession = (role, siswaId = null) => {
            state.role = role;
            state.siswaId = siswaId;
            if (role) localStorage.setItem('spmb_role', role); else localStorage.removeItem('spmb_role');
            if (siswaId) localStorage.setItem('spmb_siswaId', siswaId); else localStorage.removeItem('spmb_siswaId');
            if (!IS_PREVIEW && db) window.syncRoleListeners();
        };

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const color = type === 'success' ? 'bg-emerald-500' : 'bg-red-500';
            toast.className = `${color} text-white px-4 py-2 rounded-lg shadow-lg transform transition-all duration-300 translate-y-[-100%] opacity-0 font-medium z-[9999] flex items-center gap-2 text-sm max-w-[90vw]`;
            toast.innerHTML = `<i class="ph ${type === 'success' ? 'ph-check-circle' : 'ph-warning-circle'} text-xl shrink-0"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-[-100%]', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        };

        // Pop-up Konfirmasi Modern
        window.showConfirmModal = function({ title = 'Konfirmasi Tindakan', message = 'Apakah Anda yakin ingin melanjutkan?', confirmText = 'Ya, Lanjutkan', cancelText = 'Batal', type = 'danger' } = {}) {
            return new Promise((resolve) => {
                const existing = document.getElementById('sinergi-custom-confirm');
                if (existing) existing.remove();

                const isDanger = type === 'danger';
                const isSuccess = type === 'success';
                const iconBg = isDanger ? 'bg-red-500/15 text-red-400 border-red-500/30' : (isSuccess ? 'bg-purple-500/15 text-purple-400 border-purple-500/30' : 'bg-amber-500/15 text-amber-400 border-amber-500/30');
                const iconClass = isDanger ? 'ph-trash' : (isSuccess ? 'ph-check-circle' : 'ph-warning-circle');
                const btnBg = isDanger ? 'bg-red-500 hover:bg-red-600 shadow-red-500/25' : (isSuccess ? 'bg-purple-600 hover:bg-purple-700 shadow-purple-500/25' : 'bg-emerald-500 hover:bg-emerald-600 shadow-emerald-500/25');

                const overlay = document.createElement('div');
                overlay.id = 'sinergi-custom-confirm';
                overlay.className = 'fixed inset-0 bg-black/80 flex items-center justify-center z-[999999999] px-4 backdrop-blur-sm opacity-0 transition-opacity duration-200';
                overlay.innerHTML = `
                    <div class="bg-[#111827] border border-gray-800 w-full max-w-sm rounded-3xl p-6 sm:p-7 shadow-2xl text-center transform scale-95 transition-transform duration-200" id="sinergi-confirm-box">
                        <div class="w-16 h-16 rounded-2xl ${iconBg} border flex items-center justify-center mx-auto mb-5 shadow-inner">
                            <i class="ph ${iconClass} text-4xl"></i>
                        </div>
                        <h3 class="text-xl font-black text-white tracking-tight mb-2">${title}</h3>
                        <p class="text-sm text-gray-400 leading-relaxed mb-7">${message}</p>
                        <div class="flex gap-3">
                            <button type="button" id="sinergi-confirm-cancel" class="flex-1 py-3 px-4 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold text-sm transition-colors border border-gray-700">${cancelText}</button>
                            <button type="button" id="sinergi-confirm-ok" class="flex-1 py-3 px-4 rounded-xl ${btnBg} text-white font-bold text-sm shadow-lg transition-all transform active:scale-95">${confirmText}</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);

                requestAnimationFrame(() => {
                    overlay.classList.remove('opacity-0');
                    const box = document.getElementById('sinergi-confirm-box');
                    if (box) box.classList.remove('scale-95');
                });

                const close = (result) => {
                    overlay.classList.add('opacity-0');
                    const box = document.getElementById('sinergi-confirm-box');
                    if (box) box.classList.add('scale-95');
                    setTimeout(() => { overlay.remove(); resolve(result); }, 180);
                };

                document.getElementById('sinergi-confirm-cancel').onclick = () => close(false);
                document.getElementById('sinergi-confirm-ok').onclick = () => close(true);
            });
        };

        // Komponen Skeleton Loading
        function renderSkeletonScreen(mode = 'landing') {
            if (mode === 'landing') {
                return `
                    <div class="flex-grow overflow-y-auto relative p-4 md:p-8 flex flex-col items-center animate-pulse">
                        <div class="w-full max-w-4xl flex justify-between items-center mb-6">
                            <div class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-800"></div>
                            <div class="flex gap-2">
                                <div class="w-20 h-8 rounded-lg bg-gray-200 dark:bg-gray-800"></div>
                                <div class="w-20 h-8 rounded-lg bg-gray-200 dark:bg-gray-800"></div>
                                <div class="w-20 h-8 rounded-lg bg-gray-200 dark:bg-gray-800"></div>
                            </div>
                        </div>
                        <div class="flex items-center justify-center gap-5 mb-4">
                            <div class="w-20 h-20 md:w-24 md:h-24 rounded-2xl bg-gray-200 dark:bg-gray-800"></div>
                            <div class="w-20 h-20 md:w-24 md:h-24 rounded-2xl bg-gray-200 dark:bg-gray-800"></div>
                        </div>
                        <div class="h-9 w-64 bg-gray-200 dark:bg-gray-800 rounded-xl mb-3"></div>
                        <div class="h-4 w-80 max-w-full bg-gray-200 dark:bg-gray-800 rounded-lg mb-6"></div>
                        <div class="w-full max-w-sm h-20 bg-emerald-500/20 rounded-2xl mb-10 border border-emerald-500/20"></div>
                        <div class="w-full max-w-3xl glass rounded-3xl p-6 md:p-8 shadow-xl space-y-6">
                            <div class="h-7 w-56 bg-gray-200 dark:bg-gray-800 rounded-xl mx-auto mb-6"></div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="h-12 bg-gray-200 dark:bg-gray-800 rounded-xl"></div>
                                <div class="h-12 bg-gray-200 dark:bg-gray-800 rounded-xl"></div>
                                <div class="h-12 bg-gray-200 dark:bg-gray-800 rounded-xl"></div>
                                <div class="h-12 bg-gray-200 dark:bg-gray-800 rounded-xl"></div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4">
                                <div class="h-12 bg-gray-200 dark:bg-gray-800 rounded-xl"></div>
                                <div class="h-12 bg-gray-200 dark:bg-gray-800 rounded-xl"></div>
                            </div>
                        </div>
                    </div>
                `;
            }
            return `
                <div class="space-y-6 animate-pulse py-4">
                    <div class="h-10 w-64 bg-gray-800 rounded-2xl mb-2"></div>
                    <div class="h-4 w-48 bg-gray-800/70 rounded-lg mb-8"></div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="h-28 bg-[#111827] border border-gray-800 rounded-3xl p-6"></div>
                        <div class="h-28 bg-[#111827] border border-gray-800 rounded-3xl p-6"></div>
                        <div class="h-28 bg-[#111827] border border-gray-800 rounded-3xl p-6"></div>
                        <div class="h-28 bg-[#111827] border border-gray-800 rounded-3xl p-6"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                        <div class="h-80 bg-[#111827] border border-gray-800 rounded-3xl p-6"></div>
                        <div class="h-80 bg-[#111827] border border-gray-800 rounded-3xl p-6"></div>
                    </div>
                </div>
            `;
        }

        window.toggleTheme = function() { state.theme = state.theme === 'light' ? 'dark' : 'light'; localStorage.setItem('theme', state.theme); render(); };

        const generateId = () => crypto.randomUUID();
        const formatDateIndo = (ms) => { if(!ms) return '-'; const d = new Date(ms); const m = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; return `${String(d.getDate()).padStart(2,'0')} ${m[d.getMonth()]} ${d.getFullYear()}`; };
        const formatDateTimeIndo = (ms) => { if(!ms) return '-'; const d = new Date(ms); return `${formatDateIndo(ms)} - ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} WIB`; };
        window.getAcronym = (name) => { if(!name) return ''; const words = name.replace(/[^a-zA-Z0-9 ]/g, '').trim().split(/\s+/); return words.length === 1 ? (words[0].length > 10 ? words[0].substring(0, 10) + '...' : words[0]) : words.map(w => w[0].toUpperCase()).join(''); };
        const getCollectionPath = (colName) => IS_PREVIEW ? `/artifacts/${appId}/public/data/${colName}` : colName;

        let unsubSiswaCollection = null;
        let unsubSingleSiswa = null;
        let unsubGuruCollection = null;

        // Mengatur listener koleksi siswa & guru secara hemat kuota sesuai Role yang aktif
        window.syncRoleListeners = function() {
            if (IS_PREVIEW || !db) return;
            const isStaffRole = ['admin', 'admin_office', 'finance', 'seragam'].includes(state.role);

            if (isStaffRole) {
                if (unsubSingleSiswa) { unsubSingleSiswa(); unsubSingleSiswa = null; }
                if (!unsubGuruCollection) {
                    unsubGuruCollection = onSnapshot(collection(db, getCollectionPath('guru')), (snapshot) => {
                        state.guru = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        render();
                    });
                }
                if (!unsubSiswaCollection) {
                    state.isDataLoaded = false;
                    render();
                    unsubSiswaCollection = onSnapshot(collection(db, getCollectionPath('siswa')), (snapshot) => {
                        const allDocs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        state.allSiswaRaw = allDocs;
                        state.siswa = allDocs.filter(x => !x.isDeleted);
                        state.siswaTrash = allDocs.filter(x => x.isDeleted);
                        state.isDataLoaded = true;
                        window.syncCounterWithHighestSiswa();
                        render();
                    }, (err) => {
                        console.error("Firestore Listener Error:", err);
                        state.isDataLoaded = true;
                        render();
                    });
                }
            } else if (state.role === 'siswa' && state.siswaId) {
                if (unsubSiswaCollection) { unsubSiswaCollection(); unsubSiswaCollection = null; }
                if (unsubGuruCollection) { unsubGuruCollection(); unsubGuruCollection = null; }
                if (unsubSingleSiswa) { unsubSingleSiswa(); unsubSingleSiswa = null; }

                state.isDataLoaded = false;
                render();
                unsubSingleSiswa = onSnapshot(doc(db, getCollectionPath('siswa'), state.siswaId), (docSnap) => {
                    if (docSnap.exists() && !docSnap.data().isDeleted) {
                        const sData = { id: docSnap.id, ...docSnap.data() };
                        state.siswa = [sData];
                    } else {
                        state.siswa = [];
                    }
                    state.isDataLoaded = true;
                    render();
                }, (err) => {
                    console.error("Siswa Doc Listener Error:", err);
                    state.isDataLoaded = true;
                    render();
                });
            } else {
                // Halaman Depan (Publik): Matikan listener koleksi siswa agar hemat 98% kuota Read Firebase!
                if (unsubSiswaCollection) { unsubSiswaCollection(); unsubSiswaCollection = null; }
                if (unsubSingleSiswa) { unsubSingleSiswa(); unsubSingleSiswa = null; }
                if (unsubGuruCollection) { unsubGuruCollection(); unsubGuruCollection = null; }
                state.isDataLoaded = true;
                render();
            }
        };

        // Sinkronisasi Real-Time lintas Tab/Perangkat menggunakan BroadcastChannel
        const syncChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('sinergi_spmb_sync') : null;
        if (syncChannel) {
            syncChannel.onmessage = (event) => {
                if (event.data && event.data.type === 'SERAGAM_UPDATED') {
                    const { siswaId, seragam, seragamSize, waktuAmbilSeragam } = event.data;
                    const target = state.siswa.find(x => x.id === siswaId);
                    if (target) {
                        if (seragam !== undefined) target.seragam = seragam;
                        if (seragamSize !== undefined) target.seragamSize = seragamSize;
                        if (waktuAmbilSeragam !== undefined) target.waktuAmbilSeragam = waktuAmbilSeragam;
                        render();
                    }
                }
            };
        }

        async function initAuthAndData() {
            if (IS_PREVIEW) { state.isDataLoaded = true; render(); return; }
            render();
            try {
                if (!auth.currentUser) {
                    await signInAnonymously(auth);
                }
                const lightCols = ['gelombang', 'jurusan', 'settings'];
                let loadedCount = 0;
                lightCols.forEach(colName => {
                    onSnapshot(collection(db, getCollectionPath(colName)), (snapshot) => {
                        if (colName === 'settings') { 
                            snapshot.docs.forEach(doc => { 
                                if (doc.id === 'main') {
                                    const data = doc.data();
                                    const mergedStaff = {
                                        finance: { user: 'finance', pass: '2027', ...(data.staffAccounts?.finance || {}) },
                                        seragam: { user: 'seragam', pass: '2027', ...(data.staffAccounts?.seragam || {}) },
                                        admin_office: { user: 'office', pass: '2027', ...(data.staffAccounts?.admin_office || {}) }
                                    };
                                    const mergedInfo = {
                                        ...DEFAULT_INFO_BOARD,
                                        ...(data.infoBoard || {})
                                    };
                                    state.settings = { 
                                        ...state.settings, 
                                        ...data, 
                                        staffAccounts: mergedStaff,
                                        infoBoard: mergedInfo,
                                        waLinkGlobal: data.waLinkGlobal || DEFAULT_WA_GLOBAL 
                                    }; 
                                }
                            }); 
                        } else { 
                            state[colName] = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); 
                        }
                        loadedCount++;
                        if (loadedCount >= lightCols.length && !state.role) {
                            state.isDataLoaded = true;
                        }
                        render();
                    });
                });

                window.syncRoleListeners();
            } catch (e) { showToast("Koneksi ke database sedang padat: " + e.message, "error"); }
        }

        // Otomatis menyinkronkan counter_pendaftaran & mengunci seluruh nomor yang sudah ada
        window.syncCounterWithHighestSiswa = async function() {
            if (IS_PREVIEW || !db || state.allSiswaRaw.length === 0) return;
            try {
                let maxExisting = 0;
                const seenNumbers = new Map();

                const sortedAll = [...state.allSiswaRaw].sort((a, b) => (a.tanggalDaftar || a.createdAt || 0) - (b.tanggalDaftar || b.createdAt || 0));

                for (const s of sortedAll) {
                    const num = parseInt(s.noPendaftaran);
                    if (!isNaN(num) && num > maxExisting) maxExisting = num;
                }

                for (const s of sortedAll) {
                    if (s.isDeleted) continue;
                    const noStr = String(s.noPendaftaran || '').trim();
                    if (!noStr) continue;

                    if (seenNumbers.has(noStr)) {
                        maxExisting++;
                        const newUniqueNo = maxExisting.toString();
                        s.noPendaftaran = newUniqueNo;
                        await setDoc(doc(db, getCollectionPath('siswa'), s.id), { noPendaftaran: newUniqueNo }, { merge: true });
                        await setDoc(doc(db, getCollectionPath('settings'), `lock_${newUniqueNo}`), { siswaId: s.id, noPendaftaran: newUniqueNo, lockedAt: Date.now() }, { merge: true });
                        seenNumbers.set(newUniqueNo, s.id);
                    } else {
                        seenNumbers.set(noStr, s.id);
                    }
                }

                if (maxExisting <= 0) return;

                const counterRef = doc(db, getCollectionPath('settings'), 'counter_pendaftaran');
                const counterSnap = await getDoc(counterRef);
                const currentLastNo = (counterSnap.exists() && counterSnap.data().lastNo) ? (parseInt(counterSnap.data().lastNo) || 0) : 0;

                if (maxExisting > currentLastNo) {
                    await setDoc(counterRef, { lastNo: maxExisting }, { merge: true });
                }
            } catch (err) {
                console.warn("Auto-sync counter skipped:", err);
            }
        };

        window.fixDuplicateNumbers = async function() {
            const seen = new Map();
            const duplicates = [];

            const sortedSiswa = [...state.siswa].sort((a, b) => {
                const tA = a.tanggalDaftar || a.createdAt || 0;
                const tB = b.tanggalDaftar || b.createdAt || 0;
                return tA - tB;
            });

            for (const s of sortedSiswa) {
                const no = String(s.noPendaftaran || '').trim();
                if (!no) continue;
                if (seen.has(no)) {
                    duplicates.push(s);
                } else {
                    seen.set(no, s.id);
                }
            }

            if (duplicates.length === 0) {
                return showToast("Tidak ditemukan nomor pendaftaran ganda!", "success");
            }

            let maxNo = state.allSiswaRaw.reduce((max, s) => {
                const num = parseInt(s.noPendaftaran);
                return (!isNaN(num) && num > max) ? num : max;
            }, 0);

            const dupNames = duplicates.map(d => `${d.name} (No. ${d.noPendaftaran})`).join(', ');
            const ok = await window.showConfirmModal({
                title: 'Perbaiki Nomor Ganda Otomatis?',
                message: `Ditemukan <b>${duplicates.length} data ganda</b>: ${dupNames}.<br><br>Sistem akan memberikan nomor urut baru mulai dari <b>${maxNo + 1}</b> agar tidak ada lagi nomor yang bentrok.`,
                confirmText: 'Ya, Perbaiki Sekarang',
                type: 'warning'
            });
            if (!ok) return;

            try {
                for (const dup of duplicates) {
                    maxNo++;
                    const newNo = maxNo.toString();
                    await saveDoc('siswa', { noPendaftaran: newNo }, dup.id);
                }
                await saveDoc('settings', { lastNo: maxNo }, 'counter_pendaftaran');
                showToast(`Berhasil memperbaiki ${duplicates.length} nomor ganda! Nomor terakhir kini: ${maxNo}`, "success");
            } catch (err) {
                showToast("Gagal memperbaiki nomor ganda: " + err.message, "error");
            }
        };

                    };
                });
            } else if (colName === 'seragam') {
                const eligible = state.siswa.filter(x => x.checklist1).sort((a, b) => (parseInt(a.noPendaftaran) || 0) - (parseInt(b.noPendaftaran) || 0));
                dataToExport = eligible.map(s => {
                    const j1 = state.jurusan.find(j => j.id === s.jurusan1)?.name || '-';
                    const items = ['putihAbu','almamater','pramuka','olahraga','praktik','topi','sabuk','bet'];
                    const outputSeragam = items.map(i => `${i.toUpperCase()}: ${s.seragam[i] ? 'ADA' : 'KOSONG'}`).join(' | ');
                    return { 'Nomor Pendaftar': formatAngka(s.noPendaftaran), 'Nama Siswa': cleanStr(s.name), 'Jurusan': cleanStr(j1), 'Ukuran Praktik & Olahraga': cleanStr(s.seragamSize || '-'), 'Output Seragam': cleanStr(outputSeragam), 'Tanggal Pengambilan': s.waktuAmbilSeragam ? formatDateTimeIndo(s.waktuAmbilSeragam) : 'Belum Diambil' };
                });
            } else { dataToExport = state[colName]; }

            if (!dataToExport || dataToExport.length === 0) return showToast("Tidak ada data untuk di-export", "error");
            
            const keys = Object.keys(dataToExport[0]).filter(k => typeof dataToExport[0][k] !== 'object');
            const csvRows = [keys.map(k => `"${k}"`).join(',')];
            for (const row of dataToExport) {
                const values = keys.map(k => { let val = row[k] === null || row[k] === undefined ? '' : String(row[k]); val = val.replace(/"/g, '""'); return `"${val}"`; });
                csvRows.push(values.join(','));
            }
            
            const blob = new Blob(['\uFEFF' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.setAttribute('hidden', ''); a.setAttribute('href', url); a.setAttribute('download', `${colName}_export.csv`);
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        };
        window.triggerImport = (id) => document.getElementById(id).click();
        window.importCSV = (event, colName) => {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                const rows = e.target.result.split(/\r?\n/); if(rows.length < 2) return showToast("File CSV kosong", "error");
                const headers = rows[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').trim());
                let imported = 0;
                let maxNoPendaftaran = 0;

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i].trim(); if (!row) continue;
                    const obj = {}; let currentVal = ''; let inQuotes = false; let colIdx = 0;
                    for (let c = 0; c < row.length; c++) {
                        const char = row[c];
                        if (char === '"') inQuotes = !inQuotes;
                        else if (char === ',' && !inQuotes) { obj[headers[colIdx]] = currentVal.replace(/""/g, '"').trim(); currentVal = ''; colIdx++; } 
                        else { currentVal += char; }
                    }
                    obj[headers[colIdx]] = currentVal.replace(/""/g, '"').trim();

                    if (colName === 'siswa' && (obj.No_Pendaftaran !== undefined || obj.noPendaftaran !== undefined)) {
                        const cleanVal = (v) => (!v || v === '-') ? '' : String(v).replace(/\t/g, '').trim();
                        const noDaftar = cleanVal(obj.No_Pendaftaran || obj.noPendaftaran);
                        if (!noDaftar) continue;

                        const numNo = parseInt(noDaftar);
                        if (!isNaN(numNo) && numNo > maxNoPendaftaran) maxNoPendaftaran = numNo;

                        const j1Name = cleanVal(obj.Pilihan_Jurusan_1);
                        const j2Name = cleanVal(obj.Pilihan_Jurusan_2);
                        const guruName = cleanVal(obj.Guru_Referal);
                        const gelName = cleanVal(obj.Gelombang);
                        const isLunas = cleanVal(obj.Status_Lunas).toUpperCase() === 'LUNAS';

                        const j1Obj = state.jurusan.find(j => j.name.toUpperCase() === j1Name.toUpperCase());
                        const j2Obj = state.jurusan.find(j => j.name.toUpperCase() === j2Name.toUpperCase());
                        const guruObj = state.guru.find(g => g.name.toUpperCase() === guruName.toUpperCase());
                        const gelObj = state.gelombang.find(g => g.name.toUpperCase() === gelName.toUpperCase());

                        const siswaDoc = {
                            noPendaftaran: noDaftar,
                            name: cleanVal(obj.Nama || obj.name).toUpperCase(),
                            nisn: cleanVal(obj.NISN || obj.nisn),
                            nik: cleanVal(obj.NIK || obj.nik),
                            jk: cleanVal(obj.Jenis_Kelamin || obj.jk),
                            tempatLahir: cleanVal(obj.Tempat_Lahir || obj.tempatLahir).toUpperCase(),
                            tanggalLahir: obj.tanggalLahir || '',
                            agama: cleanVal(obj.Agama || obj.agama).toUpperCase(),
                            asalSekolah: cleanVal(obj.Asal_Sekolah || obj.asalSekolah).toUpperCase(),
                            provSekolah: cleanVal(obj.Provinsi_Sekolah || obj.provSekolah).toUpperCase(),
                            kabSekolah: cleanVal(obj.Kabupaten_Sekolah || obj.kabSekolah).toUpperCase(),
                            kecSekolah: cleanVal(obj.Kecamatan_Sekolah || obj.kecSekolah).toUpperCase(),
                            jurusan1: j1Obj ? j1Obj.id : (obj.jurusan1 || ''),
                            jurusan2: j2Obj ? j2Obj.id : (obj.jurusan2 || ''),
                            namaIbu: cleanVal(obj.Nama_Ibu || obj.namaIbu).toUpperCase(),
                            alamatOrtu: cleanVal(obj.Alamat_Ortu || obj.alamatOrtu).toUpperCase(),
                            desaOrtu: cleanVal(obj.Desa_Ortu || obj.desaOrtu).toUpperCase(),
                            kecOrtu: cleanVal(obj.Kecamatan_Ortu || obj.kecOrtu).toUpperCase(),
                            kabOrtu: cleanVal(obj.Kabupaten_Ortu || obj.kabOrtu).toUpperCase(),
                            provOrtu: cleanVal(obj.Provinsi_Ortu || obj.provOrtu).toUpperCase(),
                            hpOrtu: cleanVal(obj.No_HP_Ortu || obj.hpOrtu),
                            guruId: guruObj ? guruObj.id : (obj.guruId || null),
                            checklist1: isLunas ? true : Boolean(obj.checklist1),

                            gelombangName: isLunas ? (gelObj ? gelObj.name : (gelName || null)) : null,

                            createdAt: Date.now(),
                            tanggalDaftar: Date.now()
                        };

                        await saveDoc('siswa', siswaDoc, `reg_${noDaftar}`);
                        imported++;
                    } else {
                        if (obj.id) { const existingId = obj.id; delete obj.id; await saveDoc(colName, obj, existingId); } else { await saveDoc(colName, obj); }

                    settings: state.settings,

                    jurusan: state.jurusan,

                        for (const gr of data.guru) {
                            const { id, ...rest } = gr;
                            await saveDoc('guru', rest, id);
                        }
                    }

                    let maxNo = data.lastCounterNo || 0;
                    for (const s of data.siswa) {
                        const { id, ...rest } = s;
                        const docId = id || `reg_${s.noPendaftaran}`;
                        const num = parseInt(s.noPendaftaran);

            reader.readAsText(file);

                        const data = d.data();
                        if (!data.isDeleted) found = { id: d.id, ...data };
                    });

        window.handleRegisterBaru = async (e) => {
            e.preventDefault();
            const formElement = e.target; const btnSubmit = document.getElementById('btnSubmitFormBaru');
            const nisn = document.getElementById('spmbNisn').value.trim(); if (nisn.length !== 10) return showToast("NISN harus 10 digit!", "error");
            const jur1 = document.getElementById('spmbJurusan1').value; const jur2 = document.getElementById('spmbJurusan2').value;
            if (!jur1 || !jur2) return showToast("Pilihan Jurusan 1 dan 2 wajib diisi!", "error");
            if (jur1 === jur2) return showToast("Pilihan Jurusan tidak boleh sama!", "error");

            const activeGelombang = state.gelombang.find(g => g.isActive);
            if (!activeGelombang) return showToast("Tidak ada gelombang aktif!", "error");

            btnSubmit.disabled = true; btnSubmit.innerHTML = "Memproses...";

            try {
                if (!IS_PREVIEW) {
                    const nisnQuery = query(collection(db, getCollectionPath('siswa')), where('nisn', '==', nisn));
                    const nisnSnap = await getDocs(nisnQuery);
                    let duplicateSiswa = null;
                    nisnSnap.forEach(d => {
                        if (!d.data().isDeleted) duplicateSiswa = d.data();
                    });
                    if (duplicateSiswa) {
                        btnSubmit.disabled = false; btnSubmit.innerHTML = "Kirim Formulir Pendaftaran";
                        return showToast(`Data Kembar! NISN terdaftar di No: ${duplicateSiswa.noPendaftaran}`, "error");
                    }
                } else {
                    const exists = state.siswa.find(s => s.nisn === nisn);
                    if (exists) {
                        btnSubmit.disabled = false; btnSubmit.innerHTML = "Kirim Formulir Pendaftaran";
                        return showToast(`Data Kembar! NISN terdaftar di No: ${exists.noPendaftaran}`, "error");
                    }
                }

                const toUpper = (str) => str ? str.replace(/\s+/g, ' ').trim().toUpperCase() : '';

                const baseSiswa = {
                    gelombangId: null, gelombangName: null, 
                    asalSekolah: toUpper(document.getElementById('spmbAsalSekolah').value), provSekolah: toUpper(document.getElementById('spmbProvSekolah').value), kabSekolah: toUpper(document.getElementById('spmbKabSekolah').value), kecSekolah: toUpper(document.getElementById('spmbKecSekolah').value),
                    name: toUpper(document.getElementById('spmbName').value), nisn: nisn, jk: document.getElementById('spmbJk').value, nik: document.getElementById('spmbNik').value, tempatLahir: toUpper(document.getElementById('spmbTempatLahir').value), tanggalLahir: document.getElementById('spmbTanggalLahir').value, agama: document.getElementById('spmbAgama').value,
                    namaIbu: toUpper(document.getElementById('spmbNamaIbu').value), alamatOrtu: toUpper(document.getElementById('spmbAlamatOrtu').value), desaOrtu: toUpper(document.getElementById('spmbDesaOrtu').value), kecOrtu: toUpper(document.getElementById('spmbKecOrtu').value), kabOrtu: toUpper(document.getElementById('spmbKabOrtu').value), provOrtu: toUpper(document.getElementById('spmbProvOrtu').value), hpOrtu: document.getElementById('spmbHpOrtu').value,
                    jurusan1: jur1, jurusan2: jur2, guruId: null, checklist1: false, checklist2: false, isDeleted: false,
                    seragam: { putihAbu: false, almamater: false, pramuka: false, olahraga: false, praktik: false, topi: false, sabuk: false, bet: false },
                    seragamSize: '',
                    createdAt: Date.now(), tanggalDaftar: Date.now()
                };

                let finalSiswa = null;

                if (IS_PREVIEW) {
                    const existingNums = state.allSiswaRaw.map(s => parseInt(s.noPendaftaran)).filter(n => !isNaN(n));
                    const nextNum = Math.max(existingNums.length > 0 ? Math.max(...existingNums) : 0, parseInt(activeGelombang.startId) || 1000) + 1;
                    finalSiswa = { ...baseSiswa, id: generateId(), noPendaftaran: nextNum.toString() };
                    state.siswa.push(finalSiswa);
                    state.allSiswaRaw.push(finalSiswa);
                } else {
                    const counterRef = doc(db, getCollectionPath('settings'), 'counter_pendaftaran');
                    const startBase = parseInt(activeGelombang.startId) || 1000;

                    let isNumberGuaranteedUnique = false;
                    let safetyFloor = startBase;

                    while (!isNumberGuaranteedUnique) {
                        await runTransaction(db, async (transaction) => {
                            const counterDoc = await transaction.get(counterRef);
                            const existingNums = state.allSiswaRaw.map(s => parseInt(s.noPendaftaran)).filter(n => !isNaN(n));
                            const maxLocal = existingNums.length > 0 ? Math.max(...existingNums) : 0;
                            
                            let lastServerNum = 0;
                            if (counterDoc.exists() && counterDoc.data().lastNo) {
                                lastServerNum = parseInt(counterDoc.data().lastNo) || 0;
                            }

                            let candidateNum = Math.max(lastServerNum, maxLocal, safetyFloor) + 1;
                            let candidateDocRef = doc(db, getCollectionPath('siswa'), `reg_${candidateNum}`);
                            let lockDocRef = doc(db, getCollectionPath('settings'), `lock_${candidateNum}`);
                            
                            let candidateSnap = await transaction.get(candidateDocRef);
                            let lockSnap = await transaction.get(lockDocRef);

                            while (candidateSnap.exists() || lockSnap.exists()) {
                                candidateNum++;
                                candidateDocRef = doc(db, getCollectionPath('siswa'), `reg_${candidateNum}`);
                                lockDocRef = doc(db, getCollectionPath('settings'), `lock_${candidateNum}`);
                                candidateSnap = await transaction.get(candidateDocRef);
                                lockSnap = await transaction.get(lockDocRef);
                            }

                            const noPendaftaran = candidateNum.toString();
                            finalSiswa = { ...baseSiswa, id: `reg_${noPendaftaran}`, noPendaftaran, commitTimestamp: Date.now() };

                            transaction.set(counterRef, { lastNo: candidateNum }, { merge: true });
                            transaction.set(lockDocRef, { siswaId: finalSiswa.id, nisn: finalSiswa.nisn, lockedAt: Date.now() });
                            transaction.set(candidateDocRef, finalSiswa);
                            safetyFloor = candidateNum;
                        });

                        const verifyQuery = query(collection(db, getCollectionPath('siswa')), where('noPendaftaran', '==', finalSiswa.noPendaftaran));
                        const verifySnap = await getDocs(verifyQuery);
                        const activeDocsWithSameNo = [];
                        verifySnap.forEach(d => {
                            const dData = d.data();
                            if (!dData.isDeleted) {
                                activeDocsWithSameNo.push({ id: d.id, ...dData });
                            }
                        });

                        const otherUsersWithSameNo = activeDocsWithSameNo.filter(d => d.nisn !== finalSiswa.nisn);

                        if (otherUsersWithSameNo.length === 0) {
                            isNumberGuaranteedUnique = true;
                        } else {
                            await deleteDoc(doc(db, getCollectionPath('siswa'), finalSiswa.id));
                            safetyFloor = parseInt(finalSiswa.noPendaftaran) || safetyFloor;
                        }
                    }
                }

                formElement.reset(); 
                Array.from(document.getElementById('spmbJurusan2').options).forEach(opt => opt.disabled = false);
                showSuccessRegistration(finalSiswa);
            } catch (error) { 
                showToast("Pendaftaran gagal, silakan klik Kirim sekali lagi: " + error.message, "error"); 
            } finally { 
                btnSubmit.disabled = false; btnSubmit.innerHTML = "Kirim Formulir Pendaftaran"; 
            }
        };

        window.handleLogin = async (e) => {

                if (!s && !IS_PREVIEW) {

                                            <label class="flex items-center gap-2.5 ${isDone ? 'opacity-50 pointer-events-none' : 'cursor-pointer'} bg-gray-900 has-[:checked]:bg-purple-500/15 has-[:checked]:border-purple-500/50 p-3 rounded-xl border border-gray-800 hover:border-gray-700 transition">
                                                <input type="checkbox" id="item_${s.id}_${i.k}" ${s.seragam[i.k]?'checked':''} class="w-5 h-5 accent-purple-500 rounded shrink-0">
                                                <span class="text-xs sm:text-sm leading-snug ${(i.k==='praktik' || i.k==='olahraga')?'font-bold text-amber-300': 'font-semibold text-gray-200'}">${i.l}</span>
                                            </label>
                                        `).join('')}
                                    </div>
                                    ${!isDone ? 
                                        `<div class="flex flex-col sm:flex-row gap-2.5 sm:gap-3 mt-auto">
                                            <button type="button" onclick="window.simpanProgressSeragam('${s.id}')" class="w-full sm:w-auto bg-gray-800 hover:bg-gray-700 text-white font-bold py-3.5 px-5 rounded-xl border border-gray-700 shadow transition-all active:scale-95 text-sm">Simpan Sementara</button>
                                            <button type="button" onclick="window.selesaiSeragam('${s.id}')" class="w-full sm:w-auto bg-purple-600 hover:bg-purple-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-purple-500/20 transition-all active:scale-95 flex items-center justify-center gap-2 text-sm"><i class="ph ph-check-circle text-xl"></i> Tandai Selesai & Tuntas</button>
                                        </div>` 
                                        : 
                                        `<div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mt-auto p-3.5 bg-emerald-500/10 border border-emerald-500/20 rounded-xl">
                                            <span class="text-xs sm:text-sm font-bold text-emerald-400 flex items-center gap-2"><i class="ph ph-calendar-check text-xl shrink-0"></i> Tuntas: ${formatDateTimeIndo(s.waktuAmbilSeragam)}</span>
                                            <div class="flex gap-2">
                                                <button type="button" onclick="window.printSeragamAdmin('${s.id}')" class="flex-1 sm:flex-initial bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold py-2.5 px-4 rounded-lg shadow-md transition-colors flex items-center justify-center gap-1"><i class="ph ph-printer"></i> Cetak Bukti</button>
                                                <button type="button" onclick="window.batalSelesaiSeragam('${s.id}')" class="flex-1 sm:flex-initial text-red-400 hover:text-white hover:bg-red-500/80 font-bold text-xs py-2.5 px-4 rounded-lg border border-red-500/30 transition-colors">Batalkan Tuntas</button>
                                            </div>
                                        </div>`
                                    }
                                </div>
                            </div>
                        `}).join('')}
                        ${activeList.length === 0 ? '<div class="text-center py-12 text-gray-500"><i class="ph ph-magnifying-glass text-4xl mb-2"></i><p>Tidak ada data siswa</p></div>' : ''}
                    </div>
                `;
            }
        }

        // ==========================================
        // CHART INITIALIZERS
        // ==========================================
        const destroyExistingChart = (canvasEl) => {
            if (!canvasEl || typeof Chart === 'undefined') return;
            const existing = Chart.getChart(canvasEl);
            if (existing) existing.destroy();
        };

        window.initAdminCharts = () => {
            const ctxPeminatLunas = document.getElementById('chartPeminatVsLunas');
            const ctxKec = document.getElementById('chartKecamatan'); 
            const ctxSekolah = document.getElementById('chartAsalSekolah'); 
            const ctxJur = document.getElementById('chartJurusan'); 
            const ctxGenderJur = document.getElementById('chartGenderJurusan');
            const ctxGel = document.getElementById('chartGelombang');
            if(!ctxKec || !ctxJur || !ctxGel) return;

            [ctxPeminatLunas, ctxKec, ctxSekolah, ctxJur, ctxGenderJur, ctxGel].forEach(destroyExistingChart);

            Chart.defaults.color = '#9ca3af'; Chart.defaults.borderColor = 'rgba(255,255,255,0.05)';

            // 2. Grafik Peminat vs Lunas per Jurusan
            if (ctxPeminatLunas) {
                const jurLabels = state.jurusan.map(j => window.getAcronym(j.name));
                const peminatData = state.jurusan.map(j => state.siswa.filter(s => s.jurusan1 === j.id).length);
                const lunasJurData = state.jurusan.map(j => state.siswa.filter(s => s.jurusan1 === j.id && s.checklist2).length);

                new Chart(ctxPeminatLunas, {
                    type: 'bar',
                    data: {
                        labels: jurLabels,
                        datasets: [
                            { label: 'Total Peminat (Pilihan 1)', data: peminatData, backgroundColor: '#3b82f6', borderRadius: 6 },
                            { label: 'Sudah Lunas (C2)', data: lunasJurData, backgroundColor: '#10b981', borderRadius: 6 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: { padding: { top: 22 } },
                        plugins: { legend: { position: 'top', labels: { boxWidth: 12, color: '#e5e7eb' } } },
                        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                    }
                });
            }

            // 3. Angka Langsung di Samping Nama Kecamatan
            const normalizeKec = (str) => {
                if (!str) return '';
                return String(str).toUpperCase().replace(/[.,]/g, ' ').replace(/\s+/g, ' ').trim().replace(/^(KECAMATAN|KEC)\s+/i, '').trim();
            };

            const kecCounts = {}; 
            state.siswa.forEach(s => { 
                const k = normalizeKec(s.kecOrtu); 
                if(k) { kecCounts[k] = (kecCounts[k] || 0) + 1; } 
            });
            const sortedKec = Object.entries(kecCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
            
            new Chart(ctxKec, {
                type: 'doughnut',
                data: { labels: sortedKec.map(x => `${x[0]} (${x[1]})`), datasets: [{ data: sortedKec.map(x=>x[1]), backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '68%', plugins: { doughnutCenterText: { label: 'TOP 5 KEC' }, legend: { position: 'right', labels: { boxWidth: 12, color: '#e5e7eb' } } } }
            });

            // 3. Angka Langsung di Samping Nama SMP/MTs
            if (ctxSekolah) {
                const normalizeSekolah = (str) => {
                    if (!str) return '';
                    return String(str).toUpperCase().replace(/[.,]/g, ' ').replace(/\s+/g, ' ').trim()
                        .replace(/^SMP\s+NEGERI\s+/i, 'SMPN ')
                        .replace(/^MTS\s+NEGERI\s+/i, 'MTSN ')
                        .trim();
                };
                const sekCounts = {};
                state.siswa.forEach(s => {
                    const sk = normalizeSekolah(s.asalSekolah);
                    if (sk) { sekCounts[sk] = (sekCounts[sk] || 0) + 1; }
                });
                const sortedSek = Object.entries(sekCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);

                new Chart(ctxSekolah, {
                    type: 'doughnut',
                    data: { labels: sortedSek.map(x => `${x[0]} (${x[1]})`), datasets: [{ data: sortedSek.map(x=>x[1]), backgroundColor: ['#10b981', '#3b82f6', '#8b5cf6', '#f59e0b', '#ec4899'], borderWidth: 0 }] },
                    options: { responsive: true, maintainAspectRatio: false, cutout: '68%', plugins: { doughnutCenterText: { label: 'TOP 5 SMP' }, legend: { position: 'right', labels: { boxWidth: 12, color: '#e5e7eb' } } } }
                });
            }

            const gelLabels = ['Pendaftar (Belum)', ...state.gelombang.map(g => window.getAcronym(g.name))];
            const gelData = [
                state.siswa.filter(s => !s.checklist2).length,
                ...state.gelombang.map(g => state.siswa.filter(s => s.checklist2 && s.gelombangId === g.id).length)
            ];
            
            new Chart(ctxGel, {
                type: 'bar',
                data: { labels: gelLabels, datasets: [{ label: 'Jumlah Siswa', data: gelData, backgroundColor: ['#f59e0b', '#3b82f6', '#10b981', '#8b5cf6'], borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 20 } }, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });

            const l = state.siswa.filter(s => s.jk === 'Laki-laki').length; const p = state.siswa.filter(s => s.jk === 'Perempuan').length;
            new Chart(ctxJur, {
                type: 'doughnut',
                data: { labels: [`Laki-laki (${l})`, `Perempuan (${p})`], datasets: [{ data: [l, p], backgroundColor: ['#10b981', '#f43f5e'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '68%', plugins: { doughnutCenterText: { label: 'TOTAL SISWA' }, legend: { position: 'bottom', labels: { boxWidth: 12, color: '#e5e7eb' } } } }
            });

            // Grafik Sebaran Laki-laki & Perempuan di Setiap Jurusan
            if (ctxGenderJur) {
                const jurLabelsGender = state.jurusan.map(j => window.getAcronym(j.name));
                const lakiPerJur = state.jurusan.map(j => state.siswa.filter(s => s.jurusan1 === j.id && s.jk === 'Laki-laki').length);
                const perempuanPerJur = state.jurusan.map(j => state.siswa.filter(s => s.jurusan1 === j.id && s.jk === 'Perempuan').length);

                new Chart(ctxGenderJur, {
                    type: 'bar',
                    data: {
                        labels: jurLabelsGender,
                        datasets: [
                            { label: 'Laki-laki', data: lakiPerJur, backgroundColor: '#10b981', borderRadius: 6 },
                            { label: 'Perempuan', data: perempuanPerJur, backgroundColor: '#f43f5e', borderRadius: 6 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: { padding: { top: 22 } },
                        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, color: '#e5e7eb' } } },
                        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                    }
                });
            }
        };

        window._getSeragamDataFromDOM = (id) => { 
            const items = ['putihAbu','almamater','pramuka','olahraga','praktik','topi','sabuk','bet']; 
            const data = {}; 
            items.forEach(i => { const cb = document.getElementById(`item_${id}_${i}`); if(cb) data[i] = cb.checked; }); 
            return data; 
        };

        window._getSeragamSizeFromDOM = (id) => {
            const hiddenInput = document.getElementById(`sizeVal_${id}`);
            return hiddenInput ? (hiddenInput.value || '') : '';
        };

        // 1x klik memilih size untuk Praktik & Olahraga, klik 2x pada size aktif untuk membatalkan (netral)
        window.toggleSeragamSize = (id, clickedSize) => {
            const hiddenInput = document.getElementById(`sizeVal_${id}`);
            const badge = document.getElementById(`sizeBadge_${id}`);
            const btnContainer = document.getElementById(`sizeBtns_${id}`);
            if (!hiddenInput || !btnContainer) return;

            const currentVal = hiddenInput.value || '';
            const nextVal = currentVal === clickedSize ? '' : clickedSize;
            hiddenInput.value = nextVal;

            if (badge) {
                if (nextVal) {
                    badge.innerText = `Terpilih: ${nextVal}`;
                    badge.className = 'text-xs font-black px-3 py-1.5 rounded-lg w-fit shrink-0 bg-amber-500 text-gray-950';
                } else {
                    badge.innerText = 'Netral (Belum Dipilih)';
                    badge.className = 'text-xs font-black px-3 py-1.5 rounded-lg w-fit shrink-0 bg-gray-800 text-gray-300 border border-gray-700';
                }
            }

            btnContainer.querySelectorAll('button[data-size]').forEach(btn => {
                const sz = btn.getAttribute('data-size');
                if (sz === nextVal) {
                    btn.className = 'py-3 px-2 rounded-xl font-black text-sm tracking-wide border transition-all active:scale-95 flex items-center justify-center gap-1 bg-amber-500 text-gray-950 border-amber-400 shadow-lg shadow-amber-500/25';
                } else {
                    btn.className = 'py-3 px-2 rounded-xl font-black text-sm tracking-wide border transition-all active:scale-95 flex items-center justify-center gap-1 bg-gray-900 text-gray-200 border-gray-700 hover:border-amber-500/50 hover:text-white';
                }
            });
        };

        window.toggleAllSeragamLocal = (id, checked) => { const items = ['putihAbu','almamater','pramuka','olahraga','praktik','topi','sabuk','bet']; items.forEach(i => { const cb = document.getElementById(`item_${id}_${i}`); if(cb) cb.checked = checked; }); };
        
        window.simpanProgressSeragam = async (id) => { 
            try { 
                const data = window._getSeragamDataFromDOM(id); 
                const seragamSize = window._getSeragamSizeFromDOM(id);
                const s = state.siswa.find(x => x.id === id); 
                if (s) { 
                    s.seragam = { ...s.seragam, ...data }; 
                    s.seragamSize = seragamSize;
                    render(); 
                } 
                await saveDoc('siswa', { seragam: data, seragamSize }, id); 
                if (syncChannel) syncChannel.postMessage({ type: 'SERAGAM_UPDATED', siswaId: id, seragam: data, seragamSize });
                showToast("Progress & ukuran seragam disimpan sementara"); 
            } catch(e) { showToast("Gagal menyimpan", "error"); console.error(e); } 
        };
        
        window.selesaiSeragam = async (id) => { 
            const s = state.siswa.find(x => x.id === id); 
            const ok = await window.showConfirmModal({
                title: 'Tandai Seragam Tuntas?',
                message: `Seragam untuk <b>${s ? s.name : ''}</b> akan ditandai selesai diambil dan dipindahkan ke tab Sudah Tuntas.`,
                confirmText: 'Tandai Tuntas',
                type: 'success'
            });
            if(ok) { 
                try { 
                    const data = window._getSeragamDataFromDOM(id); 
                    const seragamSize = window._getSeragamSizeFromDOM(id);
                    const now = Date.now();
                    if (s) { 
                        s.seragam = { ...s.seragam, ...data }; 
                        s.seragamSize = seragamSize;
                        s.waktuAmbilSeragam = now; 
                    } 
                    await saveDoc('siswa', { seragam: data, seragamSize, waktuAmbilSeragam: now }, id); 
                    if (syncChannel) syncChannel.postMessage({ type: 'SERAGAM_UPDATED', siswaId: id, seragam: data, seragamSize, waktuAmbilSeragam: now });
                    window.seragamFilters.status = 'sudah';
                    render();
                    showToast("Berhasil ditandai tuntas"); 
                } catch(e) { 
                    showToast("Gagal menyimpan", "error"); console.error(e);
                } 
            } 
        };
        
        window.batalSelesaiSeragam = async (id) => { 
            const s = state.siswa.find(x => x.id === id); 
            const ok = await window.showConfirmModal({
                title: 'Batalkan Tuntas Seragam?',
                message: `Status tuntas seragam <b>${s ? s.name : ''}</b> akan dibatalkan dan dikembalikan ke tab Belum Ambil.`,
                confirmText: 'Ya, Batalkan',
                type: 'danger'
            });
            if(ok) { 
                try { 
                    if (s) { s.waktuAmbilSeragam = null; } 
                    await saveDoc('siswa', { waktuAmbilSeragam: null }, id); 
                    if (syncChannel) syncChannel.postMessage({ type: 'SERAGAM_UPDATED', siswaId: id, waktuAmbilSeragam: null });
                    window.seragamFilters.status = 'belum';
                    render();
                    showToast("Status tuntas dibatalkan");
                } catch(e) { 
                    showToast("Gagal", "error"); console.error(e);
                } 
            } 
        };

        // ==========================================
        // ROLE: SISWA & CETAK PDF
        // ==========================================
        window.generatePdfPendaftaran = (s) => {
            const jur1 = state.jurusan.find(j => j.id === s.jurusan1)?.name || '-'; const jur2 = state.jurusan.find(j => j.id === s.jurusan2)?.name || '-';
            const waLinkGlobal = state.settings?.waLinkGlobal || DEFAULT_WA_GLOBAL;
            const waQrHtml = waLinkGlobal ? `<div style="text-align: center; margin-top: 12px; border-top: 1px dashed #000; padding-top: 8px;"><p style="font-size: 9.5px; font-weight: bold; margin-bottom: 4px;">SCAN BARCODE UNTUK GABUNG GRUP WHATSAPP CALON SISWA BARU</p><img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(waLinkGlobal)}" crossorigin="anonymous" style="width: 72px; height: 72px; margin: auto; display: block;"><p style="font-size: 8.5px; margin-top: 4px; color: #1d4ed8;">Atau klik link: ${waLinkGlobal}</p></div>` : '';
            return `
                <div class="bg-white p-5 border border-gray-400 relative text-black text-left text-xs" style="margin: auto; width: 100%; max-width: 190mm; box-sizing: border-box; page-break-inside: avoid;">
                    <div style="display: flex; align-items: center; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 10px;">
                        <img src="https://iili.io/nUlnLXe.png" style="width: 52px; height: 52px; object-fit: contain; margin-right: 12px;">
                        <div style="flex-grow: 1; text-align: center;">
                            <h2 style="font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; margin: 0;">BUKTI PENDAFTARAN SISWA BARU</h2>
                            <h3 style="font-size: 13px; font-weight: 800; margin: 2px 0 0 0;">SMKS TEKNOLOGI BALUNG</h3>
                            <h3 style="font-size: 10px; font-weight: 700; margin: 2px 0 0 0;">TAHUN AJARAN 2027/2028</h3>
                        </div>
                        <img src="https://iili.io/nviRLB9.jpg" style="width: 52px; height: 52px; object-fit: contain; margin-left: 12px;">
                    </div>
                    <div style="display: flex; flex-direction: row; gap: 14px; align-items: flex-start; font-size: 11px;">
                        <div style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1.5px dashed #9ca3af; width: 2.6cm; height: 3.6cm; margin-top: 4px;"><span style="font-size: 9px; text-align: center; color: #6b7280;">Tempel<br>Foto 3x4</span></div>
                        <div style="flex-grow: 1; width: 100%;">
                            <table style="width: 100%; border-collapse: collapse; margin-bottom: 6px;">
                                <tr><td style="width: 34%; padding: 2px 0; font-weight: 600;">No Pendaftaran</td><td style="width: 12px;">:</td><td style="padding: 2px 0; font-weight: 900; font-size: 13px;">${s.noPendaftaran}</td></tr>
                                <tr><td style="padding: 2px 0; font-weight: 600;">Pilihan Jurusan 1</td><td>:</td><td style="padding: 2px 0; font-weight: 700;">${jur1}</td></tr>
                                <tr><td style="padding: 2px 0; font-weight: 600;">Pilihan Jurusan 2</td><td>:</td><td style="padding: 2px 0;">${jur2}</td></tr>
                            </table>
                            <h4 style="font-weight: 800; border-bottom: 1px solid #cbd5e1; margin: 6px 0 4px 0; padding-bottom: 2px; font-size: 10.5px; text-transform: uppercase;">A. Data Calon Siswa</h4>
                            <table style="width: 100%; border-collapse: collapse; margin-bottom: 6px;">
                                <tr><td style="width: 34%; padding: 2px 0;">Nama Peserta</td><td style="width: 12px;">:</td><td style="padding: 2px 0; text-transform: uppercase; font-weight: 700;">${s.name}</td></tr>
                                <tr><td style="padding: 2px 0;">NISN</td><td>:</td><td style="padding: 2px 0;">${s.nisn}</td></tr>
                                <tr><td style="padding: 2px 0;">Jenis Kelamin</td><td>:</td><td style="padding: 2px 0;">${s.jk || '-'}</td></tr>
                                <tr><td style="padding: 2px 0;">NIK</td><td>:</td><td style="padding: 2px 0;">${s.nik || '-'}</td></tr>
                                <tr><td style="padding: 2px 0;">Tempat Lahir</td><td>:</td><td style="padding: 2px 0;">${s.tempatLahir || '-'}</td></tr>
                                <tr><td style="padding: 2px 0;">Tanggal Lahir</td><td>:</td><td style="padding: 2px 0;">${formatDateIndo(s.tanggalLahir)}</td></tr>
                                <tr><td style="padding: 2px 0;">Agama</td><td>:</td><td style="padding: 2px 0;">${s.agama || '-'}</td></tr>
                            </table>
                            <h4 style="font-weight: 800; border-bottom: 1px solid #cbd5e1; margin: 6px 0 4px 0; padding-bottom: 2px; font-size: 10.5px; text-transform: uppercase;">B. Data Sekolah Asal</h4>
                            <table style="width: 100%; border-collapse: collapse; margin-bottom: 6px;">
                                <tr><td style="width: 34%; padding: 2px 0;">Asal Sekolah</td><td style="width: 12px;">:</td><td style="padding: 2px 0;">${s.asalSekolah || '-'}</td></tr>
                                <tr><td style="padding: 2px 0;">Provinsi & Kabupaten</td><td>:</td><td style="padding: 2px 0;">${s.provSekolah || '-'}, ${s.kabSekolah || '-'}</td></tr>
                            </table>
                            <h4 style="font-weight: 800; border-bottom: 1px solid #cbd5e1; margin: 6px 0 4px 0; padding-bottom: 2px; font-size: 10.5px; text-transform: uppercase;">C. Data Orang Tua</h4>
                            <table style="width: 100%; border-collapse: collapse; margin-bottom: 4px;">
                                <tr><td style="width: 34%; padding: 2px 0;">Nama Ibu Kandung</td><td style="width: 12px;">:</td><td style="padding: 2px 0;">${s.namaIbu || '-'}</td></tr>
                                <tr><td style="padding: 2px 0;">Alamat Lengkap</td><td>:</td><td style="padding: 2px 0;">${s.alamatOrtu || '-'}, Desa ${s.desaOrtu || '-'}, Kec. ${s.kecOrtu || '-'}</td></tr>
                                <tr><td style="padding: 2px 0;">No. Telepon (HP)</td><td>:</td><td style="padding: 2px 0;">${s.hpOrtu || '-'}</td></tr>
                            </table>
                        </div>
                    </div>
                    <div style="display: flex; justify-content: flex-end; align-items: flex-end; margin-top: 8px; font-size: 10px; text-align: center;">
                        <div><p style="margin-bottom: 28px;">Balung, ${formatDateIndo(s.tanggalDaftar || s.createdAt)}</p><p style="text-transform: uppercase; font-weight: 700; text-decoration: underline;">${s.name}</p></div>
                    </div>
                    ${waQrHtml}
                    <div style="margin-top: 8px; font-size: 8.5px; font-style: italic; color: #374151; border-top: 1px solid #e5e7eb; padding-top: 4px;">* Apabila ada kesalahan data, tidak perlu mengisi kembali formulir, silahkan hubungi panitia.</div>
                </div>
            `;
        };

        window.generatePdfSeragam = (s) => {
            const jur1 = state.jurusan.find(j => j.id === s.jurusan1)?.name || '-';
            const sizeBadge = s.seragamSize ? ` (Size: ${s.seragamSize})` : '';
            return `
                <div class="bg-white p-8 border border-gray-300 text-black" style="margin: auto; width: 100%;">
                    <h2 class="text-xl font-black text-center mb-6 uppercase border-b-2 border-black pb-2">BUKTI PENGAMBILAN SERAGAM</h2>
                    <table class="w-full mb-4 text-sm">
                        <tr><td class="w-1/3 font-semibold">Nama Siswa</td><td class="w-4">:</td><td class="font-bold">${s.name}</td></tr>
                        <tr><td class="font-semibold">No Pendaftaran</td><td>:</td><td>${s.noPendaftaran}</td></tr>
                        <tr><td class="font-semibold">Jurusan</td><td>:</td><td>${jur1}</td></tr>
                        <tr><td class="font-semibold">Ukuran Praktik & Olahraga</td><td>:</td><td class="font-bold">${s.seragamSize || '-'}</td></tr>
                        <tr><td class="font-semibold">Waktu Ambil</td><td>:</td><td>${formatDateTimeIndo(s.waktuAmbilSeragam)}</td></tr>
                    </table>

        window._printContent = (htmlContent, isLandscape = false, fileName = 'Dokumen_SPMB') => {
            const buffer = document.getElementById('print-buffer');
            buffer.innerHTML = htmlContent;
            
            const originalTitle = document.title;
            document.title = fileName;

            let styleEl = document.getElementById('dynamic-print-style');
            if (!styleEl) {
                styleEl = document.createElement('style');
                styleEl.id = 'dynamic-print-style';
                document.head.appendChild(styleEl);
            }
            styleEl.innerHTML = `@page { size: A4 ${isLandscape ? 'landscape' : 'portrait'}; margin: 10mm; }`;

            const imgs = Array.from(buffer.querySelectorAll('img'));
            const waitPromises = imgs.map(img => new Promise(resolve => {
                if (img.complete) return resolve();
                img.onload = resolve;
                img.onerror = resolve;
                setTimeout(resolve, 2500);
            }));

            Promise.all(waitPromises).then(() => {
                document.documentElement.classList.add('printing');
                document.body.classList.add('printing');

                const cleanup = () => {
                    document.documentElement.classList.remove('printing');
                    document.body.classList.remove('printing');
                    document.title = originalTitle;
                    window.removeEventListener('afterprint', cleanup);
                };
                window.addEventListener('afterprint', cleanup);

                setTimeout(() => {
                    window.print();
                    setTimeout(cleanup, 1500);
                }, 150);
            });
        };
