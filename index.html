        // Safe storage helper untuk menghindari SecurityError di sandboxed iframe
        const safeStorage = {

        // Helper aman untuk escape teks HTML & atribut
        const escHtml = (val) => String(val ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        let db, auth;

        // Plugin Global Chart.js untuk Menampilkan Angka Statistik di Tengah Doughnut Chart
        const doughnutCenterTextPlugin = {
            id: 'doughnutCenterText',
            beforeDraw(chart) {
                if (!chart || chart.config?.type !== 'doughnut') return;
                const { ctx, chartArea } = chart;
                if (!ctx || !chartArea) return;
                const dataset = chart.data?.datasets?.[0];
                if (!dataset || !Array.isArray(dataset.data)) return;
                const total = dataset.data.reduce((acc, val) => acc + (Number(val) || 0), 0);

                ctx.save();
                const centerX = (chartArea.left + chartArea.right) / 2;
                const centerY = (chartArea.top + chartArea.bottom) / 2;

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = '900 24px Inter, sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(total.toString(), centerX, centerY - 7);

                ctx.font = '700 9px Inter, sans-serif';
                ctx.fillStyle = '#9ca3af';
                const subLabel = chart.config.options?.plugins?.doughnutCenterText?.label || 'SISWA';
                ctx.fillText(subLabel, centerX, centerY + 13);
                ctx.restore();
            }
        };

        // Plugin Global Chart.js untuk Menampilkan Angka Langsung di Atas Batang & Titik Grafik
        const inlineValueLabelPlugin = {
            id: 'inlineValueLabel',
            afterDatasetsDraw(chart) {
                if (!chart || !chart.config) return;
                const chartType = chart.config.type;
                if (chartType !== 'bar' && chartType !== 'line') return;
                const { ctx } = chart;
                if (!ctx || !Array.isArray(chart.data?.datasets)) return;
                chart.data.datasets.forEach((dataset, i) => {
                    if (!dataset || !Array.isArray(dataset.data)) return;
                    const meta = chart.getDatasetMeta(i);
                    if (!meta || meta.hidden || !Array.isArray(meta.data)) return;
                    const totalPts = dataset.data.length;
                    const step = totalPts > 10 ? Math.ceil(totalPts / 7) : 1;
                    meta.data.forEach((element, index) => {
                        if (!element || typeof element.tooltipPosition !== 'function') return;
                        const value = dataset.data[index];
                        if (value === null || value === undefined) return;
                        if (chartType === 'bar' && value === 0) return;
                        if (chartType === 'line' && totalPts > 10 && index !== 0 && index !== totalPts - 1 && index % step !== 0) return;
                        ctx.save();
                        ctx.fillStyle = chartType === 'line' ? (dataset.pointLabelColor || '#34d399') : '#f3f4f6';
                        ctx.font = '800 11px Inter, sans-serif';
                        ctx.textAlign = 'center';
                        const yOffset = dataset.labelYOffset !== undefined ? dataset.labelYOffset : (chartType === 'line' ? -8 : -4);
                        ctx.textBaseline = yOffset > 0 ? 'top' : 'bottom';
                        const pos = element.tooltipPosition();
                        ctx.fillText(String(value), pos.x, pos.y + yOffset);
                        ctx.restore();
                    });
                });
            }
        };

        if (typeof Chart !== 'undefined') {
            Chart.register(doughnutCenterTextPlugin, inlineValueLabelPlugin);
        }

        const SERAGAM_SIZES = ['L', 'XL', 'XXL', 'XXXL', 'JUMBO'];
        const DEFAULT_WA_GLOBAL = 'https://chat.whatsapp.com/CthGrupGlobalSPMB';
        const DEFAULT_INFO_BOARD = {
            isActive: true,
            title: 'INFORMASI PENTING PENDAFTARAN SPMB',
            content: '1. Pastikan data NISN (10 digit) dan NIK (16 digit) diisi sesuai dengan Ijazah/Kartu Keluarga.\n2. Setelah mengirim formulir, wajib mencatat Nomor Pendaftaran & mencetak Bukti Pendaftaran.\n3. Bergabunglah ke Grup WhatsApp resmi melalui link yang tersedia untuk mendapatkan jadwal daftar ulang.',

        // State dengan persistensi login otomatis (safeStorage)
        let state = {
            role: safeStorage.get('spmb_role') || null, 
            siswaId: safeStorage.get('spmb_siswaId') || null,
            theme: safeStorage.get('theme') || 'light',
            isDataLoaded: false,

            guru: [],
            siswa: [],
            siswaTrash: [],
            allSiswaRaw: [],
            settings: { 
                staffAccounts: {

                    seragam: { user: 'seragam', pass: '2027' },
                    admin_office: { user: 'office', pass: '2027' }
                },
                waLinkGlobal: DEFAULT_WA_GLOBAL,
                infoBoard: { ...DEFAULT_INFO_BOARD }
            }
        };

        window.saveSession = (role, siswaId = null) => {
            state.role = role;
            state.siswaId = siswaId;
            if (role) {
                safeStorage.set('spmb_role', role);
                if (siswaId) safeStorage.set('spmb_siswaId', siswaId);
                else safeStorage.remove('spmb_siswaId');
            } else {
                safeStorage.remove('spmb_role');

            if (window.syncRoleListeners) window.syncRoleListeners();

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-xl shadow-2xl border text-white font-medium text-sm flex items-center gap-3 transition-all duration-300 transform translate-x-full opacity-0 ${type === 'error' ? 'bg-red-600/95 border-red-400/50' : 'bg-emerald-600/95 border-emerald-400/50'} backdrop-blur-md`;
            toast.innerHTML = `<i class="ph ${type === 'error' ? 'ph-warning-circle text-xl' : 'ph-check-circle text-xl'}"></i> <span>${escHtml(msg)}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-x-full', 'opacity-0'));
            setTimeout(() => { toast.classList.add('translate-x-full', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3500);
        }
        window.showToast = showToast;

        // Custom Modal Konfirmasi Modern (Menggantikan window.confirm bawaan yang terblokir iframe)
        window.showConfirmModal = function({ title = 'Konfirmasi Tindakan', message = 'Apakah Anda yakin melanjutkan tindakan ini?', confirmText = 'Ya, Lanjutkan', cancelText = 'Batal', type = 'danger' }) {
            return new Promise((resolve) => {
                const existing = document.getElementById('sinergi-confirm-modal');
                if (existing) existing.remove();

                const isDanger = type === 'danger';
                const isWarning = type === 'warning';
                const iconClass = isDanger ? 'ph-trash text-red-500 bg-red-500/10 border-red-500/20' : (isWarning ? 'ph-warning text-amber-500 bg-amber-500/10 border-amber-500/20' : 'ph-question text-emerald-500 bg-emerald-500/10 border-emerald-500/20');
                const btnClass = isDanger ? 'bg-red-600 hover:bg-red-700 shadow-red-600/25' : (isWarning ? 'bg-amber-600 hover:bg-amber-700 shadow-amber-600/25' : 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-600/25');

                const overlay = document.createElement('div');
                overlay.id = 'sinergi-confirm-modal';
                overlay.className = 'fixed inset-0 bg-black/75 flex items-center justify-center z-[999999999] px-4 backdrop-blur-sm opacity-0 transition-opacity duration-200';
                overlay.innerHTML = `
                    <div class="bg-white dark:bg-[#111827] border border-gray-200 dark:border-gray-800 w-full max-w-md rounded-3xl p-6 md:p-7 shadow-2xl transform scale-95 transition-transform duration-200" id="sinergi-confirm-box">
                        <div class="w-14 h-14 rounded-2xl border flex items-center justify-center mx-auto mb-5 ${iconClass}">
                            <i class="ph ${iconClass.split(' ')[0]} text-3xl"></i>
                        </div>
                        <h3 class="text-xl font-black text-center text-gray-900 dark:text-white tracking-tight mb-2">${title}</h3>
                        <p class="text-sm text-center text-gray-600 dark:text-gray-400 leading-relaxed mb-7">${message}</p>
                        <div class="flex gap-3">
                            <button type="button" id="sinergi-confirm-cancel" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 transition-colors">${cancelText}</button>
                            <button type="button" id="sinergi-confirm-ok" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm text-white shadow-lg transition-all active:scale-95 ${btnClass}">${confirmText}</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);

                requestAnimationFrame(() => {
                    overlay.classList.remove('opacity-0');
                    const box = document.getElementById('sinergi-confirm-box');
                    if (box) box.classList.remove('scale-95');
                });

                const close = (result) => {
                    overlay.classList.add('opacity-0');
                    const box = document.getElementById('sinergi-confirm-box');
                    if (box) box.classList.add('scale-95');
                    setTimeout(() => { overlay.remove(); resolve(result); }, 180);
                };

                document.getElementById('sinergi-confirm-cancel').onclick = () => close(false);
                document.getElementById('sinergi-confirm-ok').onclick = () => close(true);
            });
        };

        // Komponen Skeleton Loading
        function renderSkeletonScreen(mode = 'landing') {
            if (mode === 'landing') {
                return `
                    <div class="flex-grow overflow-y-auto relative p-4 md:p-8 flex flex-col items-center animate-pulse">
                        <div class="w-full max-w-4xl flex justify-between items-center mb-6">
                            <div class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-800"></div>
                            <div class="flex gap-2">
                                <div class="w-20 h-8 rounded-lg bg-gray-200 dark:bg-gray-800"></div>
                                <div class="w-20 h-8 rounded-lg bg-gray-200 dark:bg-gray-800"></div>
                                <div class="w-20 h-8 rounded-lg bg-gray-200 dark:bg-gray-800"></div>
                            </div>
                        </div>
                        <div class="flex items-center justify-center gap-5 mb-4">
                            <div class="w-20 h-20 md:w-24 md:h-24 rounded-2xl bg-gray-200 dark:bg-gray-800"></div>
                            <div class="w-20 h-20 md:w-24 md:h-24 rounded-2xl bg-gray-200 dark:bg-gray-800"></div>
                        </div>
                        <div class="h-9 w-64 bg-gray-200 dark:bg-gray-800 rounded-xl mb-3"></div>
                        <div class="h-4 w-80 max-w-full bg-gray-200 dark:bg-gray-800 rounded-lg mb-6"></div>
                        <div class="w-full max-w-sm h-20 bg-emerald-500/20 rounded-2xl mb-10 border border-emerald-500/20"></div>
                        <div class="w-full max-w-3xl glass rounded-3xl p-6 md:p-8 shadow-xl space-y-6">
                            <div class="h-7 w-56 bg-gray-200 dark:bg-gray-800 rounded-xl mx-auto mb-6"></div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="h-12 bg-gray-200 dark:bg-gray-800 rounded-xl"></div>
                                <div class="h-12 bg-gray-200 dark:bg-gray-800 rounded-xl"></div>
                                <div class="h-12 bg-gray-200 dark:bg-gray-800 rounded-xl"></div>
                                <div class="h-12 bg-gray-200 dark:bg-gray-800 rounded-xl"></div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4">
                                <div class="h-12 bg-gray-200 dark:bg-gray-800 rounded-xl"></div>
                                <div class="h-12 bg-gray-200 dark:bg-gray-800 rounded-xl"></div>
                            </div>
                        </div>
                    </div>
                `;
            }
            return `
                <div class="space-y-6 animate-pulse py-4">
                    <div class="h-10 w-64 bg-gray-800 rounded-2xl mb-2"></div>
                    <div class="h-4 w-48 bg-gray-800/70 rounded-lg mb-8"></div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="h-28 bg-[#111827] border border-gray-800 rounded-3xl p-6"></div>
                        <div class="h-28 bg-[#111827] border border-gray-800 rounded-3xl p-6"></div>
                        <div class="h-28 bg-[#111827] border border-gray-800 rounded-3xl p-6"></div>
                        <div class="h-28 bg-[#111827] border border-gray-800 rounded-3xl p-6"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                        <div class="h-80 bg-[#111827] border border-gray-800 rounded-3xl p-6"></div>
                        <div class="h-80 bg-[#111827] border border-gray-800 rounded-3xl p-6"></div>
                    </div>
                </div>
            `;
        }

        window.toggleTheme = function() { state.theme = state.theme === 'light' ? 'dark' : 'light'; safeStorage.set('theme', state.theme); render(); };

        const generateId = () => {
            if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
                return crypto.randomUUID();
            }
            return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 10);
        };
        const formatDateIndo = (ms) => {
            if(!ms) return '-';
            const d = new Date(ms);
            if (isNaN(d.getTime())) return String(ms);
            const m = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
            return `${String(d.getDate()).padStart(2,'0')} ${m[d.getMonth()]} ${d.getFullYear()}`;
        };
        const formatDateTimeIndo = (ms) => {
            if(!ms) return '-';
            const d = new Date(ms);
            if (isNaN(d.getTime())) return String(ms);
            return `${formatDateIndo(ms)} - ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} WIB`;
        };
        window.getAcronym = (name) => { if(!name) return ''; const words = String(name).replace(/[^a-zA-Z0-9 ]/g, '').trim().split(/\s+/); return words.length === 1 ? (words[0].length > 10 ? words[0].substring(0, 10) + '...' : words[0]) : words.map(w => w[0].toUpperCase()).join(''); };
        const getCollectionPath = (colName) => IS_PREVIEW ? `/artifacts/${appId}/public/data/${colName}` : colName;

        let unsubSiswaCollection = null;
        let unsubSingleSiswa = null;
        let unsubGuruCollection = null;

        // Mengatur listener koleksi siswa & guru secara hemat kuota sesuai Role yang aktif
        window.syncRoleListeners = function() {
            if (IS_PREVIEW || !db) return;
            const isStaffRole = ['admin', 'admin_office', 'finance', 'seragam'].includes(state.role);

            if (isStaffRole) {
                if (unsubSingleSiswa) { unsubSingleSiswa(); unsubSingleSiswa = null; }
                if (!unsubGuruCollection) {
                    unsubGuruCollection = onSnapshot(collection(db, getCollectionPath('guru')), (snapshot) => {
                        state.guru = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        render();
                    }, (err) => {
                        console.warn("Guru Listener Error:", err);
                    });
                }
                if (!unsubSiswaCollection) {
                    state.isDataLoaded = false;
                    render();
                    unsubSiswaCollection = onSnapshot(collection(db, getCollectionPath('siswa')), (snapshot) => {
                        const allDocs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        state.allSiswaRaw = allDocs;
                        state.siswa = allDocs.filter(x => !x.isDeleted);
                        state.siswaTrash = allDocs.filter(x => x.isDeleted);
                        state.isDataLoaded = true;
                        window.syncCounterWithHighestSiswa();
                        render();
                    }, (err) => {
                        console.warn("Firestore Listener Error:", err);
                        state.isDataLoaded = true;
                        showToast("Gagal memuat data siswa: " + (err?.message || 'Periksa koneksi/izin'), "error");
                        render();
                    });
                }
            } else if (state.role === 'siswa' && state.siswaId) {
                if (unsubSiswaCollection) { unsubSiswaCollection(); unsubSiswaCollection = null; }
                if (unsubGuruCollection) { unsubGuruCollection(); unsubGuruCollection = null; }
                if (unsubSingleSiswa) { unsubSingleSiswa(); unsubSingleSiswa = null; }

                state.isDataLoaded = false;
                render();
                unsubSingleSiswa = onSnapshot(doc(db, getCollectionPath('siswa'), state.siswaId), (docSnap) => {
                    if (docSnap.exists() && !docSnap.data().isDeleted) {
                        const sData = { id: docSnap.id, ...docSnap.data() };
                        state.siswa = [sData];
                    } else {
                        state.siswa = [];
                    }
                    state.isDataLoaded = true;
                    render();
                }, (err) => {
                    console.warn("Siswa Doc Listener Error:", err);
                    state.isDataLoaded = true;
                    render();
                });
            } else {
                if (unsubSiswaCollection) { unsubSiswaCollection(); unsubSiswaCollection = null; }
                if (unsubSingleSiswa) { unsubSingleSiswa(); unsubSingleSiswa = null; }
                if (unsubGuruCollection) { unsubGuruCollection(); unsubGuruCollection = null; }
                state.isDataLoaded = true;
                render();
            }
        };

        // Sinkronisasi Real-Time lintas Tab Perangkat menggunakan BroadcastChannel
        const syncChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('sinergi_spmb_sync') : null;
        if (syncChannel) {
            syncChannel.onmessage = (event) => {
                if (event.data && event.data.type === 'SERAGAM_UPDATED') {
                    const { siswaId, seragam, seragamSize, waktuAmbilSeragam } = event.data;
                    const target = state.siswa.find(x => x.id === siswaId);
                    if (target) {
                        if (seragam !== undefined) target.seragam = seragam;
                        if (seragamSize !== undefined) target.seragamSize = seragamSize;
                        if (waktuAmbilSeragam !== undefined) target.waktuAmbilSeragam = waktuAmbilSeragam;
                        render();
                    }
                }
            };
        }

        // Menunggu hingga sesi Firebase Auth benar-benar siap tanpa menimpa sesi Admin yang sudah tersimpan
        function ensureFirebaseAuth() {
            return new Promise((resolve) => {
                if (!auth) return resolve(null);
                if (auth.currentUser) return resolve(auth.currentUser);
                let settled = false;
                const done = (user) => {
                    if (settled) return;
                    settled = true;
                    resolve(user);
                };
                const unsub = onAuthStateChanged(auth, (user) => {
                    unsub();
                    if (user) {
                        done(user);
                    } else {
                        signInAnonymously(auth)
                            .then((cred) => done(cred.user))
                            .catch((err) => {
                                const code = err?.code || '';
                                let authHint = err?.message || 'Unknown auth error';
                                if (code === 'auth/operation-not-allowed' || code === 'auth/admin-restricted-operation') {
                                    authHint = "Aktifkan metode 'Anonymous' di Firebase Console → Authentication → Sign-in method!";
                                } else if (code === 'auth/unauthorized-domain') {
                                    authHint = "Domain pratinjau belum terdaftar di Firebase Authentication → Settings → Authorized domains (Aplikasi tetap berjalan normal di Vercel Anda).";
                                }
                                showToast("Info Auth Firebase: " + authHint, "error");
                                done(null);
                            });
                    }
                });
                setTimeout(() => { unsub(); done(auth.currentUser || null); }, 4000);
            });
        }

        // Otomatis menyinkronkan counter_pendaftaran & mengunci seluruh nomor yang sudah ada (khusus sesi Admin)
        window.syncCounterWithHighestSiswa = async function() {
            if (IS_PREVIEW || !db || state.role !== 'admin' || state.allSiswaRaw.length === 0) return;
            try {
                let maxExisting = 0;
                const seenNumbers = new Map();

                const sortedAll = [...state.allSiswaRaw].sort((a, b) => (a.tanggalDaftar || a.createdAt || 0) - (b.tanggalDaftar || b.createdAt || 0));

                for (const s of sortedAll) {
                    const num = parseInt(s.noPendaftaran);
                    if (!isNaN(num) && num > maxExisting) maxExisting = num;
                }

                for (const s of sortedAll) {
                    if (s.isDeleted) continue;
                    const noStr = String(s.noPendaftaran || '').trim();
                    if (!noStr) continue;

                    if (seenNumbers.has(noStr)) {
                        maxExisting++;
                        const newUniqueNo = maxExisting.toString();
                        s.noPendaftaran = newUniqueNo;
                        await setDoc(doc(db, getCollectionPath('siswa'), s.id), { noPendaftaran: newUniqueNo }, { merge: true });
                        await setDoc(doc(db, getCollectionPath('settings'), `lock_${newUniqueNo}`), { siswaId: s.id, noPendaftaran: newUniqueNo, lockedAt: Date.now() }, { merge: true });
                        seenNumbers.set(newUniqueNo, s.id);
                    } else {
                        seenNumbers.set(noStr, s.id);
                    }
                }

                if (maxExisting <= 0) return;

                const counterRef = doc(db, getCollectionPath('settings'), 'counter_pendaftaran');
                const counterSnap = await getDoc(counterRef);
                const currentLastNo = (counterSnap.exists() && counterSnap.data().lastNo) ? (parseInt(counterSnap.data().lastNo) || 0) : 0;

                if (maxExisting > currentLastNo) {
                    await setDoc(counterRef, { lastNo: maxExisting }, { merge: true });
                }
            } catch (err) {
                console.warn("Auto-sync counter skipped:", err);
            }
        };

        window.fixDuplicateNumbers = async function() {
            const seen = new Map();
            const duplicates = [];

            const sortedSiswa = [...state.siswa].sort((a, b) => {
                const tA = a.tanggalDaftar || a.createdAt || 0;
                const tB = b.tanggalDaftar || b.createdAt || 0;
                return tA - tB;
            });

            for (const s of sortedSiswa) {
                const no = String(s.noPendaftaran || '').trim();
                if (!no) continue;
                if (seen.has(no)) {
                    duplicates.push(s);
                } else {
                    seen.set(no, s.id);
                }
            }

            if (duplicates.length === 0) {
                return showToast("Tidak ditemukan nomor pendaftaran ganda!", "success");
            }

            let maxNo = state.allSiswaRaw.reduce((max, s) => {
                const num = parseInt(s.noPendaftaran);
                return (!isNaN(num) && num > max) ? num : max;
            }, 0);

            const dupNames = duplicates.map(d => `${d.name || 'Tanpa Nama'} (No. ${d.noPendaftaran})`).join(', ');
            const ok = await window.showConfirmModal({
                title: 'Perbaiki Nomor Ganda Otomatis?',
                message: `Ditemukan <b>${duplicates.length} data ganda</b>: ${escHtml(dupNames)}.<br><br>Sistem akan memberikan nomor urut baru mulai dari <b>${maxNo + 1}</b> agar tidak ada lagi nomor yang bentrok.`,
                confirmText: 'Ya, Perbaiki Sekarang',
                type: 'warning'
            });
            if (!ok) return;

            try {
                for (const dup of duplicates) {
                    maxNo++;
                    const newNo = maxNo.toString();
                    await saveDoc('siswa', { noPendaftaran: newNo }, dup.id);
                }
                await saveDoc('settings', { lastNo: maxNo }, 'counter_pendaftaran');
                showToast(`Berhasil memperbaiki ${duplicates.length} nomor ganda! Nomor terakhir kini: ${maxNo}`, "success");
            } catch (err) {
                showToast("Gagal memperbaiki nomor ganda: " + (err?.message || 'Error'), "error");
            }
        };

        window.handleRegisterBaru = async (e) => {
            e.preventDefault();
            const formElement = e.target; const btnSubmit = document.getElementById('btnSubmitFormBaru');
            const toUpper = (str) => str ? str.replace(/\s+/g, ' ').trim().toUpperCase() : '';
            const cleanDigits = (str) => str ? String(str).replace(/\D/g, '') : '';

            // Validasi ketat JavaScript (mencegah input kosong / hanya berisi spasi)
            const requiredFields = [
                { id: 'spmbAsalSekolah', label: 'Asal Sekolah' },
                { id: 'spmbProvSekolah', label: 'Provinsi Sekolah' },
                { id: 'spmbKabSekolah', label: 'Kabupaten Sekolah' },

                { id: 'spmbName', label: 'Nama Peserta' },

                { id: 'spmbNik', label: 'NIK' },
                { id: 'spmbTempatLahir', label: 'Tempat Lahir' },
                { id: 'spmbTanggalLahir', label: 'Tanggal Lahir' },
                { id: 'spmbAgama', label: 'Agama' },
                { id: 'spmbNamaIbu', label: 'Nama Ibu Kandung' },
                { id: 'spmbAlamatOrtu', label: 'Alamat Orang Tua' },
                { id: 'spmbDesaOrtu', label: 'Desa/Kelurahan' },
                { id: 'spmbKecOrtu', label: 'Kecamatan Orang Tua' },
                { id: 'spmbKabOrtu', label: 'Kabupaten Orang Tua' },
                { id: 'spmbProvOrtu', label: 'Provinsi Orang Tua' },
                { id: 'spmbHpOrtu', label: 'No. Telepon (HP)' },
                { id: 'spmbJurusan1', label: 'Pilihan Jurusan 1' },
                { id: 'spmbJurusan2', label: 'Pilihan Jurusan 2' }
            ];

            for (const field of requiredFields) {
                const el = document.getElementById(field.id);
                const val = el ? el.value.trim() : '';
                if (!val) {
                    if (el) el.focus();
                    return showToast(`Kolom "${field.label}" wajib diisi dan tidak boleh kosong!`, "error");
                }
            }

            const nisn = cleanDigits(document.getElementById('spmbNisn').value);
            if (nisn.length !== 10) {
                document.getElementById('spmbNisn')?.focus();
                return showToast("NISN harus 10 digit angka!", "error");
            }
            const nik = cleanDigits(document.getElementById('spmbNik').value);
            if (nik.length !== 16) {
                document.getElementById('spmbNik')?.focus();
                return showToast("NIK harus 16 digit angka!", "error");
            }
            const jk = document.getElementById('spmbJk').value.trim();
            if (jk !== 'Laki-laki' && jk !== 'Perempuan') {
                document.getElementById('spmbJk')?.focus();
                return showToast("Jenis Kelamin wajib dipilih!", "error");
            }
            const jur1 = document.getElementById('spmbJurusan1').value.trim();
            const jur2 = document.getElementById('spmbJurusan2').value.trim();
            if (!jur1 || !jur2) return showToast("Pilihan Jurusan 1 dan 2 wajib diisi!", "error");
            if (jur1 === jur2) return showToast("Pilihan Jurusan tidak boleh sama!", "error");

            const activeGelombang = state.gelombang.find(g => g.isActive);
            if (!activeGelombang) return showToast("Tidak ada gelombang aktif!", "error");

            btnSubmit.disabled = true; btnSubmit.innerHTML = "Memproses...";

            try {
                if (!IS_PREVIEW) {
                    await ensureFirebaseAuth();
                    const nisnQuery = query(collection(db, getCollectionPath('siswa')), where('nisn', '==', nisn));
                    const nisnSnap = await getDocs(nisnQuery);
                    let duplicateSiswa = null;
                    nisnSnap.forEach(d => {
                        if (!d.data().isDeleted) duplicateSiswa = d.data();
                    });
                    if (duplicateSiswa) {
                        btnSubmit.disabled = false; btnSubmit.innerHTML = "Kirim Formulir Pendaftaran";
                        return showToast(`Data Kembar! NISN terdaftar di No: ${duplicateSiswa.noPendaftaran}`, "error");
                    }
                } else {
                    const exists = state.siswa.find(s => s.nisn === nisn);
                    if (exists) {
                        btnSubmit.disabled = false; btnSubmit.innerHTML = "Kirim Formulir Pendaftaran";
                        return showToast(`Data Kembar! NISN terdaftar di No: ${exists.noPendaftaran}`, "error");
                    }
                }

                const baseSiswa = {
                    gelombangId: null, gelombangName: null, 
                    asalSekolah: toUpper(document.getElementById('spmbAsalSekolah').value), provSekolah: toUpper(document.getElementById('spmbProvSekolah').value), kabSekolah: toUpper(document.getElementById('spmbKabSekolah').value), kecSekolah: toUpper(document.getElementById('spmbKecSekolah').value),
                    name: toUpper(document.getElementById('spmbName').value), nisn: nisn, jk: jk, nik: nik, tempatLahir: toUpper(document.getElementById('spmbTempatLahir').value), tanggalLahir: document.getElementById('spmbTanggalLahir').value, agama: document.getElementById('spmbAgama').value,
                    namaIbu: toUpper(document.getElementById('spmbNamaIbu').value), alamatOrtu: toUpper(document.getElementById('spmbAlamatOrtu').value), desaOrtu: toUpper(document.getElementById('spmbDesaOrtu').value), kecOrtu: toUpper(document.getElementById('spmbKecOrtu').value), kabOrtu: toUpper(document.getElementById('spmbKabOrtu').value), provOrtu: toUpper(document.getElementById('spmbProvOrtu').value), hpOrtu: cleanDigits(document.getElementById('spmbHpOrtu').value),
                    jurusan1: jur1, jurusan2: jur2, guruId: null, checklist1: false, checklist2: false, isDeleted: false,
                    seragam: { putihAbu: false, almamater: false, pramuka: false, olahraga: false, praktik: false, topi: false, sabuk: false, bet: false },
                    seragamSize: '',
                    createdAt: Date.now(), tanggalDaftar: Date.now()
                };

                let finalSiswa = null;

                if (IS_PREVIEW) {
                    const existingNums = state.allSiswaRaw.map(s => parseInt(s.noPendaftaran)).filter(n => !isNaN(n));
                    const nextNum = Math.max(existingNums.length > 0 ? Math.max(...existingNums) : 0, parseInt(activeGelombang.startId) || 1000) + 1;
                    finalSiswa = { ...baseSiswa, id: generateId(), noPendaftaran: nextNum.toString() };
                    state.siswa.push(finalSiswa);
                    state.allSiswaRaw.push(finalSiswa);
                } else {
                    const counterRef = doc(db, getCollectionPath('settings'), 'counter_pendaftaran');
                    const startBase = parseInt(activeGelombang.startId) || 1000;

                    let isNumberGuaranteedUnique = false;
                    let safetyFloor = startBase;

                    while (!isNumberGuaranteedUnique) {
                        await runTransaction(db, async (transaction) => {
                            const counterDoc = await transaction.get(counterRef);
                            const existingNums = state.allSiswaRaw.map(s => parseInt(s.noPendaftaran)).filter(n => !isNaN(n));
                            const maxLocal = existingNums.length > 0 ? Math.max(...existingNums) : 0;
                            
                            let lastServerNum = 0;
                            if (counterDoc.exists() && counterDoc.data().lastNo) {
                                lastServerNum = parseInt(counterDoc.data().lastNo) || 0;
                            }

                            let candidateNum = Math.max(lastServerNum, maxLocal, safetyFloor) + 1;
                            let candidateDocRef = doc(db, getCollectionPath('siswa'), `reg_${candidateNum}`);
                            let lockDocRef = doc(db, getCollectionPath('settings'), `lock_${candidateNum}`);
                            
                            let candidateSnap = await transaction.get(candidateDocRef);
                            let lockSnap = await transaction.get(lockDocRef);

                            while (candidateSnap.exists() || lockSnap.exists()) {
                                candidateNum++;
                                candidateDocRef = doc(db, getCollectionPath('siswa'), `reg_${candidateNum}`);
                                lockDocRef = doc(db, getCollectionPath('settings'), `lock_${candidateNum}`);
                                candidateSnap = await transaction.get(candidateDocRef);
                                lockSnap = await transaction.get(lockDocRef);
                            }

                            const noPendaftaran = candidateNum.toString();
                            finalSiswa = { ...baseSiswa, id: `reg_${noPendaftaran}`, noPendaftaran, commitTimestamp: Date.now() };

                            transaction.set(counterRef, { lastNo: candidateNum }, { merge: true });
                            transaction.set(lockDocRef, { siswaId: finalSiswa.id, nisn: finalSiswa.nisn, lockedAt: Date.now() });
                            transaction.set(candidateDocRef, finalSiswa);
                            safetyFloor = candidateNum;
                        });

                        const verifyQuery = query(collection(db, getCollectionPath('siswa')), where('noPendaftaran', '==', finalSiswa.noPendaftaran));
                        const verifySnap = await getDocs(verifyQuery);
                        const activeDocsWithSameNo = [];
                        verifySnap.forEach(d => {
                            const dData = d.data();
                            if (!dData.isDeleted) {
                                activeDocsWithSameNo.push({ id: d.id, ...dData });
                            }
                        });

                        const otherUsersWithSameNo = activeDocsWithSameNo.filter(d => d.nisn !== finalSiswa.nisn);

                        if (otherUsersWithSameNo.length === 0) {
                            isNumberGuaranteedUnique = true;
                        } else {
                            try { await deleteDoc(doc(db, getCollectionPath('siswa'), finalSiswa.id)); } catch (_) {}
                            safetyFloor = parseInt(finalSiswa.noPendaftaran) || safetyFloor;
                        }
                    }
                }

                formElement.reset(); 
                const j2El = document.getElementById('spmbJurusan2');
                if (j2El) Array.from(j2El.options).forEach(opt => opt.disabled = false);
                showSuccessRegistration(finalSiswa);
            } catch (error) { 
                showToast("Pendaftaran gagal, silakan klik Kirim sekali lagi: " + (error?.message || 'Error'), "error"); 
            } finally { 
                btnSubmit.disabled = false; btnSubmit.innerHTML = "Kirim Formulir Pendaftaran"; 
            }
        };

        window.handleLogin = async (e) => {
            e.preventDefault(); const role = document.getElementById('loginRole').value;
            const pass = document.getElementById('loginPassword').value;
            
            if (role === 'admin') {
                if (!auth) return showToast("Auth Firebase tidak tersedia", "error");
                try { await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, pass); window.currentTab = null; window.saveSession(role); } 
                catch (err) { return showToast("Gagal login admin: " + (err?.message || "Cek email/password"), "error"); }
            } else if (role === 'siswa') {
                const id = document.getElementById('loginId').value.trim();
                let s = state.siswa.find(x => String(x.noPendaftaran || '').trim() === id && !x.isDeleted);
                
                if (!s && !IS_PREVIEW) {
                    try {
                        await ensureFirebaseAuth();
                        const directRef = doc(db, getCollectionPath('siswa'), `reg_${id}`);
                        const directSnap = await getDoc(directRef);
                        if (directSnap.exists() && !directSnap.data().isDeleted) {
                            s = { id: directSnap.id, ...directSnap.data() };
                        } else {
                            const q = query(collection(db, getCollectionPath('siswa')), where('noPendaftaran', '==', id));
                            const qSnap = await getDocs(q);
                            qSnap.forEach(d => {
                                if (!d.data().isDeleted) s = { id: d.id, ...d.data() };
                            });
                        }
                    } catch (err) {
                        return showToast("Gagal memeriksa data login: " + (err?.message || 'Error'), "error");
                    }
                }

                if (s) {
                    const cleanName = (str) => String(str || '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                    if (cleanName(s.namaIbu) === cleanName(pass)) { 
                        state.siswa = [s];
                        window.currentTab = null;
                        window.saveSession(role, s.id); 
                    } 
                    else { return showToast("Password (Nama Ibu) salah", "error"); }
                } else return showToast("Nomor Pendaftaran tidak ditemukan", "error");
            } else {
                const u = document.getElementById('loginEmail').value; const acc = state.settings.staffAccounts[role];
                if (acc && acc.user === u && acc.pass === pass) { window.currentTab = null; window.saveSession(role); } 
                else return showToast("Username / Password staf salah", "error");

            closeModal('login-modal'); render();

        // ==========================================
        // CHART INITIALIZERS
        // ==========================================
        const destroyExistingChart = (canvasEl) => {
            if (!canvasEl || typeof Chart === 'undefined') return;
            const existing = Chart.getChart(canvasEl);
            if (existing) existing.destroy();
        };

        window.adminWeekOffset = 0;

        window.changeAdminWeek = (delta, resetToCurrent = false) => {
            if (resetToCurrent) {
                window.adminWeekOffset = 0;
            } else {
                window.adminWeekOffset = Math.min(0, (window.adminWeekOffset || 0) + delta);
            }
            render();
        };

        window.getAdminWeeklySeries = () => {
            const offset = window.adminWeekOffset || 0;
            const dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
            const monthShort = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

            const baseDate = new Date();
            baseDate.setHours(0, 0, 0, 0);
            baseDate.setDate(baseDate.getDate() + (offset * 7));

            const labels = [];
            const counts = [];
            let firstDateLabel = '';
            let lastDateLabel = '';

            for (let i = 6; i >= 0; i--) {
                const dStart = new Date(baseDate);
                dStart.setDate(baseDate.getDate() - i);
                const startMs = dStart.getTime();
                const endMs = startMs + (24 * 60 * 60 * 1000) - 1;

                const dateStr = `${dStart.getDate()} ${monthShort[dStart.getMonth()]}`;
                if (i === 6) firstDateLabel = `${dateStr} ${dStart.getFullYear()}`;
                if (i === 0) lastDateLabel = `${dateStr} ${dStart.getFullYear()}`;

                const isToday = offset === 0 && i === 0;
                labels.push(isToday ? `Hari Ini (${dateStr})` : `${dayNames[dStart.getDay()]}, ${dateStr}`);

                const dailyCount = state.siswa.filter(s => {
                    const ts = s.tanggalDaftar || s.createdAt || 0;
                    return ts >= startMs && ts <= endMs;
                }).length;
                counts.push(dailyCount);
            }

            const totalWeek = counts.reduce((sum, v) => sum + v, 0);
            return {

                    const validRegTimes = state.siswa
                        .map(s => Number(s.tanggalDaftar || s.createdAt || 0))
                        .filter(ts => ts > 0);

                    const nowDate = new Date();
                    nowDate.setHours(23, 59, 59, 999);
                    const endMs = nowDate.getTime();

                    const earliestDate = validRegTimes.length > 0 ? new Date(Math.min(...validRegTimes)) : new Date(endMs - 6 * 24 * 60 * 60 * 1000);
                    earliestDate.setHours(0, 0, 0, 0);
                    const startMs = earliestDate.getTime();

                    const totalSpanDays = Math.max(1, Math.round((endMs - startMs) / (24 * 60 * 60 * 1000)));
                    const stepDays = totalSpanDays <= 14 ? 1 : (totalSpanDays <= 112 ? 7 : 14);
                    const stepMs = stepDays * 24 * 60 * 60 * 1000;

                    const sLabels = [];
                    const cumRegData = [];
                    const cumLunasData = [];

                    let cursorStart = startMs;
                    let periodIdx = 1;
                    while (cursorStart <= endMs) {
                        const cursorEnd = Math.min(endMs, cursorStart + stepMs - 1);
                        const isLastBucket = cursorEnd >= endMs;
                        const dLabel = new Date(cursorEnd);
                        const dateShort = `${dLabel.getDate()} ${monthShort[dLabel.getMonth()]}`;

                        if (isLastBucket) {
                            sLabels.push(`Hari Ini (${dateShort})`);
                        } else if (stepDays === 1) {
                            sLabels.push(dateShort);
                        } else {
                            sLabels.push(`Pekan ${periodIdx} (${dateShort})`);
                        }

                            cumRegData.push(state.siswa.length);
                            cumLunasData.push(state.siswa.filter(s => s.checklist2).length);
                        } else {
                            const regCount = state.siswa.filter(s => {
                                const ts = Number(s.tanggalDaftar || s.createdAt || startMs);
                                return ts <= cursorEnd;
                            }).length;

                                if (!s.checklist2) return false;
                                const ts = Number(s.waktuLunas || s.tanggalDaftar || s.createdAt || startMs);
                                return ts <= cursorEnd;
                            }).length;
                            cumRegData.push(regCount);
                            cumLunasData.push(lunasCount);
                        }

                        cursorStart += stepMs;
                        periodIdx++;
                    }

                    const ctxS2d = ctxSCurve.getContext('2d');
                    let blueGrad = 'rgba(59, 130, 246, 0.2)';
                    let emeraldGrad = 'rgba(16, 185, 129, 0.2)';

                        emeraldGrad.addColorStop(1, 'rgba(16, 185, 129, 0.0)');
                    }

                        type: 'line',
                        data: {
                            labels: sLabels,
                            datasets: [
                                {
                                    label: 'Akumulasi Total Pendaftar',
                                    data: cumRegData,

                                    pointLabelColor: '#60a5fa',

service cloud.firestore {

             && data.get('jurusan2', '') is string && data.get('jurusan2', '').size() > 0
             && data.get('jurusan1', '') != data.get('jurusan2', '')
             && data.get('checklist1', false) == false
             && data.get('checklist2', false) == false
             && data.get('isDeleted', false) == false;
    }
    function isValidStaffUpdate(newData, oldData) {
      return oldData.get('isDeleted', false) == false
             && newData.get('isDeleted', false) == false
             && newData.get('noPendaftaran', '') == oldData.get('noPendaftaran', '')
             && newData.get('nisn', '') == oldData.get('nisn', '')
             && newData.get('name', '') == oldData.get('name', '')
             && newData.get('namaIbu', '') == oldData.get('namaIbu', '');
    }

    match /gelombang/{docId} {
      allow read: if true;
      allow write: if isAdmin();
    }
    match /jurusan/{docId} {
      allow read: if true;
      allow write: if isAdmin();
    }
    match /guru/{docId} {
      allow read: if true;
      allow write: if isAdmin();
    }
    match /settings/{docId} {
      allow read: if true;
    }
    match /settings/main {
      allow write: if isAdmin();
    }
    match /settings/counter_pendaftaran {
      allow create: if isSignedIn() && request.resource.data.get('lastNo', 0) is int && request.resource.data.get('lastNo', 0) > 0;
      allow update: if isAdmin() || (isSignedIn() && request.resource.data.get('lastNo', 0) is int && (!(resource.data.get('lastNo', 0) is int) || request.resource.data.get('lastNo', 0) > resource.data.get('lastNo', 0)));
      allow delete: if isAdmin();
    }
    match /settings/{lockDoc} {
      allow create: if isSignedIn() && lockDoc != 'main' && lockDoc != 'counter_pendaftaran' && lockDoc.matches('lock_[0-9]+') && !exists(/databases/$(database)/documents/settings/$(lockDoc));
      allow update, delete: if isAdmin();

      allow update: if isAdmin() || (isSignedIn() && isValidStaffUpdate(request.resource.data, resource.data));
      allow delete: if isAdmin();
    }
    match /{document=**} {
      allow read, write: if false;
    }
  }
}`;

        // ==========================================

        function _printContent(html) {
            const buffer = document.getElementById('print-buffer');
            buffer.innerHTML = html;
            
            document.documentElement.classList.add('printing');
            document.body.classList.add('printing');
            
            let cleanedUp = false;
            const cleanup = () => {
                if (cleanedUp) return;
                cleanedUp = true;
                document.documentElement.classList.remove('printing');
                document.body.classList.remove('printing');
                buffer.innerHTML = '';
            };

            window.addEventListener('afterprint', cleanup, { once: true });

            const images = Array.from(buffer.querySelectorAll('img'));
            const waitImages = images.map(img => {
                if (img.complete && img.naturalHeight !== 0) return Promise.resolve();
                return new Promise(resolve => {
                    img.onload = resolve;
                    img.onerror = resolve;
                    setTimeout(resolve, 1500);
                });
            });

            Promise.all(waitImages).then(() => {
                setTimeout(() => {
                    window.print();
                    setTimeout(cleanup, 3000);
                }, 200);
            });
        }
