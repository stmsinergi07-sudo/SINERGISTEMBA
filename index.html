    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }

        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

<body class="min-h-screen flex flex-col">

    <div id="toast-container" class="fixed top-4 right-4 z-[99999999] flex flex-col gap-2 pointer-events-none"></div>

    <div id="app-root" class="bg-gray-50 text-gray-800 dark:bg-darkBg dark:text-gray-200 flex-grow flex flex-col h-screen overflow-hidden">
        <!-- Renders Dynamically -->
    </div>

    <!-- Data Khusus Cetak Dinamis -->
    <div id="print-buffer" class="hidden"></div>

    <script type="module">
        const IS_PREVIEW = false;

        const firebaseConfig = {
            apiKey: "AIzaSyDBDyPoXj0toZ3poge6y9kcqEKFMjFlRWo", 
            authDomain: "sinergi-ppdb.firebaseapp.com", 
            projectId: "sinergi-ppdb",
            storageBucket: "sinergi-ppdb.firebasestorage.app", 
            messagingSenderId: "724940886839", 
            appId: "1:724940886839:web:f9a40c37e5b83ce13a40b2"
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sinergi-spmb';

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let db, auth;
        if (!IS_PREVIEW) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        }

        const state = {
            role: null, siswaId: null, gelombang: [], jurusan: [], guru: [], siswa: [],
            settings: { staffAccounts: { finance: { user: 'finance', pass: '2027' }, seragam: { user: 'seragam', pass: '2027' } }, waLinkGlobal: '' },
            theme: localStorage.getItem('theme') || 'light'
        };

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const color = type === 'success' ? 'bg-emerald-500' : 'bg-red-500';
            toast.className = `${color} text-white px-4 py-2 rounded-lg shadow-lg transform transition-all duration-300 translate-y-[-100%] opacity-0 font-medium z-[9999] flex items-center gap-2`;
            toast.innerHTML = `<i class="ph ${type === 'success' ? 'ph-check-circle' : 'ph-warning-circle'} text-xl"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-[-100%]', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        };

        window.toggleTheme = function() { state.theme = state.theme === 'light' ? 'dark' : 'light'; localStorage.setItem('theme', state.theme); render(); };

        const generateId = () => crypto.randomUUID();
        const formatDateIndo = (ms) => { if(!ms) return '-'; const d = new Date(ms); const m = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; return `${String(d.getDate()).padStart(2,'0')} ${m[d.getMonth()]} ${d.getFullYear()}`; };
        const formatDateTimeIndo = (ms) => { if(!ms) return '-'; const d = new Date(ms); return `${formatDateIndo(ms)} - ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} WIB`; };
        window.getAcronym = (name) => { if(!name) return ''; const words = name.replace(/[^a-zA-Z0-9 ]/g, '').trim().split(/\s+/); return words.length === 1 ? (words[0].length > 10 ? words[0].substring(0, 10) + '...' : words[0]) : words.map(w => w[0].toUpperCase()).join(''); };
        const getCollectionPath = (colName) => IS_PREVIEW ? `/artifacts/${appId}/public/data/${colName}` : colName;

        async function initAuthAndData() {
            if (IS_PREVIEW) { render(); return; }
            try {
                await signInAnonymously(auth);
                const cols = ['gelombang', 'jurusan', 'guru', 'siswa', 'settings'];
                cols.forEach(colName => {
                    onSnapshot(collection(db, getCollectionPath(colName)), (snapshot) => {
                        if (colName === 'settings') { snapshot.docs.forEach(doc => { if (doc.id === 'main') state.settings = { ...state.settings, ...doc.data() }; }); } 
                        else { state[colName] = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); }
                        render();
                    });
                });
            } catch (e) { alert("GAGAL KONEKSI KE FIREBASE!\n\nPesan Error: " + e.message); }
        }

        async function saveDoc(colName, data, docId = null) {
            if (IS_PREVIEW) return;
            const id = docId || (colName === 'settings' ? 'main' : generateId());
            await setDoc(doc(db, getCollectionPath(colName), id), data, { merge: true });
            return id;
        }
        
        window.deleteDocHandler = async (colName, id) => { if(confirm('Yakin hapus data ini permanen?')) { try { await deleteDoc(doc(db, getCollectionPath(colName), id)); showToast('Data dihapus', 'success'); } catch(e) { showToast('Gagal: ' + e.message, 'error'); } } };

        const root = document.getElementById('app-root');
        window.render = render;
        
        function render() {
            // Trik khusus agar saat admin mengetik pencarian, keyboard tidak kehilangan fokus
            let activeId = document.activeElement ? document.activeElement.id : null;
            let selStart = null, selEnd = null;
            if (activeId && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
                try { selStart = document.activeElement.selectionStart; selEnd = document.activeElement.selectionEnd; } catch(e){}
            }

            document.documentElement.className = state.theme;
            root.innerHTML = !state.role ? renderLandingPage() : renderDashboard();
            
            if (activeId) {
                let el = document.getElementById(activeId);
                if (el) {
                    el.focus();
                    if (selStart !== null) { try { el.setSelectionRange(selStart, selEnd); } catch(e){} }
                }
            }

            setTimeout(() => {
                if (state.role === 'admin' && (!window.currentTab || window.currentTab === 'dash')) { if (window.initAdminCharts) window.initAdminCharts(); } 
                else if (state.role === 'finance' && (!window.currentTab || window.currentTab === 'dash')) { if (window.initFinanceCharts) window.initFinanceCharts(); }
            }, 50);
        }

        // ==========================================
        // EXPORT / IMPORT CSV
        // ==========================================
        window.exportCSV = (colName) => {
            let dataToExport = [];
            const formatAngka = (str) => str ? String(str).trim() + '\t' : '-';
            const cleanStr = (str) => (str === null || str === undefined) ? '-' : String(str).replace(/\r?\n|\r/g, ' ').replace(/"/g, '').trim();
            
            if (colName === 'siswa') {
                dataToExport = state.siswa.map(s => {
                    const j1 = state.jurusan.find(j => j.id === s.jurusan1)?.name || '-';
                    const j2 = state.jurusan.find(j => j.id === s.jurusan2)?.name || '-';
                    const guru = state.guru.find(g => g.id === s.guruId)?.name || '-';
                    return {
                        No_Pendaftaran: formatAngka(s.noPendaftaran), Nama: cleanStr(s.name), NISN: formatAngka(s.nisn), NIK: formatAngka(s.nik),
                        Jenis_Kelamin: cleanStr(s.jk), Tempat_Lahir: cleanStr(s.tempatLahir), Tanggal_Lahir: s.tanggalLahir ? formatDateIndo(s.tanggalLahir) : '-',
                        Agama: cleanStr(s.agama), Asal_Sekolah: cleanStr(s.asalSekolah), Provinsi_Sekolah: cleanStr(s.provSekolah), Kabupaten_Sekolah: cleanStr(s.kabSekolah), Kecamatan_Sekolah: cleanStr(s.kecSekolah),
                        Pilihan_Jurusan_1: cleanStr(j1), Pilihan_Jurusan_2: cleanStr(j2), Nama_Ibu: cleanStr(s.namaIbu),
                        Alamat_Ortu: cleanStr(s.alamatOrtu), Desa_Ortu: cleanStr(s.desaOrtu), Kecamatan_Ortu: cleanStr(s.kecOrtu), Kabupaten_Ortu: cleanStr(s.kabOrtu), Provinsi_Ortu: cleanStr(s.provOrtu),
                        No_HP_Ortu: formatAngka(s.hpOrtu), Guru_Referal: cleanStr(guru), Status_Lunas: s.checklist2 ? 'LUNAS' : 'BELUM LUNAS', Gelombang: cleanStr(s.gelombangName || '-'), Waktu_Pendaftaran: s.tanggalDaftar ? formatDateTimeIndo(s.tanggalDaftar) : (s.createdAt ? formatDateTimeIndo(s.createdAt) : '-')
                    };
                });
            } else if (colName === 'seragam') {
                const eligible = state.siswa.filter(x => x.checklist1).sort((a, b) => (parseInt(a.noPendaftaran) || 0) - (parseInt(b.noPendaftaran) || 0));
                dataToExport = eligible.map(s => {
                    const j1 = state.jurusan.find(j => j.id === s.jurusan1)?.name || '-';
                    const items = ['putihAbu','almamater','pramuka','olahraga','praktik','topi','sabuk','bet'];
                    const outputSeragam = items.map(i => `${i.toUpperCase()}: ${s.seragam[i] ? 'ADA' : 'KOSONG'}`).join(' | ');
                    return { 'Nomor Pendaftar': formatAngka(s.noPendaftaran), 'Nama Siswa': cleanStr(s.name), 'Jurusan': cleanStr(j1), 'Output Seragam': cleanStr(outputSeragam), 'Tanggal Pengambilan': s.waktuAmbilSeragam ? formatDateTimeIndo(s.waktuAmbilSeragam) : 'Belum Diambil' };
                });
            } else { dataToExport = state[colName]; }

            if (!dataToExport || dataToExport.length === 0) return showToast("Tidak ada data untuk di-export", "error");
            
            const keys = Object.keys(dataToExport[0]).filter(k => typeof dataToExport[0][k] !== 'object');
            const csvRows = [keys.map(k => `"${k}"`).join(',')];
            for (const row of dataToExport) {
                const values = keys.map(k => { let val = row[k] === null || row[k] === undefined ? '' : String(row[k]); val = val.replace(/"/g, '""'); return `"${val}"`; });
                csvRows.push(values.join(','));
            }
            
            const blob = new Blob(['\uFEFF' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.setAttribute('hidden', ''); a.setAttribute('href', url); a.setAttribute('download', `${colName}_export.csv`);
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        };
        window.triggerImport = (id) => document.getElementById(id).click();
        window.importCSV = (event, colName) => {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                const rows = e.target.result.split('\n'); if(rows.length < 2) return showToast("File CSV kosong", "error");
                const headers = rows[0].split(',').map(h => h.trim().replace(/"/g, ''));
                let imported = 0;
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i].trim(); if (!row) continue;
                    const obj = {}; let currentVal = ''; let inQuotes = false; let colIdx = 0;
                    for (let c = 0; c < row.length; c++) {
                        const char = row[c];
                        if (char === '"') inQuotes = !inQuotes;
                        else if (char === ',' && !inQuotes) { obj[headers[colIdx]] = currentVal.replace(/"/g, ''); currentVal = ''; colIdx++; } 
                        else { currentVal += char; }
                    }
                    obj[headers[colIdx]] = currentVal.replace(/"/g, '');
                    if (obj.id) { const existingId = obj.id; delete obj.id; await saveDoc(colName, obj, existingId); } else { await saveDoc(colName, obj); }
                    imported++;
                }
                showToast(`Berhasil import ${imported} data`); event.target.value = ''; 
            };
            reader.readAsText(file);
        };

        // ==========================================
        // UI: LANDING PAGE & LOGIN
        // ==========================================
        function renderLandingPage() {
            const activeGelombang = state.gelombang.find(g => g.isActive);
            const jurusanOptions = state.jurusan.map(j => `<option value="${j.id}">${j.name}</option>`).join('');

            return `
                <div class="flex-grow overflow-y-auto relative p-4 md:p-8 flex flex-col items-center">
                    <div class="w-full max-w-4xl flex justify-between items-center mb-6">
                        <button onclick="toggleTheme()" class="p-2 rounded-full glass hover:bg-gray-200 transition"><i class="ph ${state.theme === 'light' ? 'ph-moon' : 'ph-sun'} text-xl"></i></button>
                        <div class="flex gap-2">
                            <button onclick="openModal('login-modal', 'admin')" class="p-2 px-3 text-xs rounded glass font-bold text-gray-700 dark:text-gray-300"><i class="ph ph-shield mr-1"></i> Admin</button>
                            <button onclick="openModal('login-modal', 'finance')" class="p-2 px-3 text-xs rounded glass font-bold text-gray-700 dark:text-gray-300"><i class="ph ph-wallet mr-1"></i> Finance</button>
                            <button onclick="openModal('login-modal', 'seragam')" class="p-2 px-3 text-xs rounded glass font-bold text-gray-700 dark:text-gray-300"><i class="ph ph-t-shirt mr-1"></i> Seragam</button>
                        </div>
                    </div>

                    <div class="flex items-center justify-center gap-5 mb-4">
                        <img src="https://iili.io/nUlnLXe.png" alt="Logo Sekolah" class="w-20 h-20 md:w-24 md:h-24 object-contain drop-shadow-xl">
                        <img src="https://iili.io/nviRLB9.jpg" alt="Logo Sinergi" class="w-20 h-20 md:w-24 md:h-24 object-contain rounded-2xl shadow-lg">
                    </div>
                    <h1 class="text-3xl md:text-4xl font-bold text-center text-primaryDark dark:text-primary mb-2 tracking-tight">SINERGI SPMB</h1>
                    <p class="text-center text-sm mb-6 max-w-lg opacity-80">Sistem Integrasi Registrasi dan Informasi Penerimaan Murid Baru</p>

                    <div class="mb-10 w-full max-w-sm flex justify-center">
                        <button onclick="openModal('login-modal', 'siswa')" class="w-full flex flex-col items-center justify-center p-4 bg-primary text-white rounded-2xl shadow-xl shadow-primary/30 hover:shadow-primary/50 transition-all transform active:scale-95 border border-primaryDark">
                            <div class="flex items-center gap-3"><i class="ph ph-sign-in text-3xl"></i><span class="font-black text-2xl tracking-wide">LOGIN</span></div>
                            <span class="text-xs font-medium opacity-90 mt-1">Bagi yang sudah mengisi formulir</span>
                        </button>
                    </div>

                    <div class="w-full max-w-3xl glass rounded-3xl p-6 md:p-8 shadow-xl mb-12">
                        ${!activeGelombang ? `<div class="text-center py-10 text-red-500 font-bold text-xl"><i class="ph ph-warning-circle text-4xl mb-2"></i><br>Pendaftaran Sedang Ditutup</div>` : 
                            `<h2 class="text-2xl font-bold mb-6 border-b pb-3 text-center tracking-tight">Formulir Pendaftaran</h2>
                            <form id="spmbForm" onsubmit="handleRegisterBaru(event)" class="space-y-6">
                                <div class="bg-white/50 dark:bg-black/20 p-5 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm">
                                    <h3 class="font-bold text-primaryDark dark:text-primary mb-4 flex items-center gap-2"><i class="ph ph-buildings text-lg"></i> DATA SEKOLAH (SMP/MTs)</h3>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div><label class="block text-xs font-semibold mb-1">Asal Sekolah</label><input type="text" id="spmbAsalSekolah" required class="w-full p-2.5 text-sm rounded-xl border bg-white dark:bg-darkCard dark:border-gray-600 uppercase focus:border-primary outline-none transition-colors"></div>
                                        <div><label class="block text-xs font-semibold mb-1">Provinsi</label><input type="text" id="spmbProvSekolah" required class="w-full p-2.5 text-sm rounded-xl border bg-white dark:bg-darkCard dark:border-gray-600 uppercase focus:border-primary outline-none transition-colors"></div>
                                        <div><label class="block text-xs font-semibold mb-1">Kabupaten</label><input type="text" id="spmbKabSekolah" required class="w-full p-2.5 text-sm rounded-xl border bg-white dark:bg-darkCard dark:border-gray-600 uppercase focus:border-primary outline-none transition-colors"></div>
                                        <div><label class="block text-xs font-semibold mb-1">Kecamatan</label><input type="text" id="spmbKecSekolah" required class="w-full p-2.5 text-sm rounded-xl border bg-white dark:bg-darkCard dark:border-gray-600 uppercase focus:border-primary outline-none transition-colors"></div>
                                    </div>
                                </div>
                                
                                <div class="bg-white/50 dark:bg-black/20 p-5 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm">
                                    <h3 class="font-bold text-primaryDark dark:text-primary mb-4 flex items-center gap-2"><i class="ph ph-user text-lg"></i> DATA CALON SISWA</h3>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div><label class="block text-xs font-semibold mb-1">Nama Peserta</label><input type="text" id="spmbName" required class="w-full p-2.5 text-sm rounded-xl border bg-white dark:bg-darkCard dark:border-gray-600 uppercase focus:border-primary outline-none transition-colors"></div>
                                        <div>
                                            <label class="block text-xs font-semibold mb-1">NISN (10 Digit)</label>
                                            <input type="text" id="spmbNisn" required pattern="[0-9]{10}" minlength="10" maxlength="10" class="w-full p-2.5 text-sm rounded-xl border bg-white dark:bg-darkCard dark:border-gray-600 focus:border-primary outline-none transition-colors">
                                            <p class="text-[10px] text-gray-500 mt-1">* NISN dapat dilihat di Ijazah SD/SMP</p>
                                        </div>
                                        <div><label class="block text-xs font-semibold mb-1">Jenis Kelamin</label>
                                            <select id="spmbJk" required class="w-full p-2.5 text-sm rounded-xl border bg-white dark:bg-darkCard dark:border-gray-600 focus:border-primary outline-none transition-colors"><option value="">Pilih...</option><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option></select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold mb-1">NIK (16 Digit)</label>
                                            <input type="text" id="spmbNik" required pattern="[0-9]{16}" minlength="16" maxlength="16" class="w-full p-2.5 text-sm rounded-xl border bg-white dark:bg-darkCard dark:border-gray-600 focus:border-primary outline-none transition-colors">
                                            <p class="text-[10px] text-gray-500 mt-1">* NIK dapat dilihat di Kartu Keluarga (KK)</p>
                                        </div>
                                        <div><label class="block text-xs font-semibold mb-1">Tempat Lahir</label><input type="text" id="spmbTempatLahir" required class="w-full p-2.5 text-sm rounded-xl border bg-white dark:bg-darkCard dark:border-gray-600 uppercase focus:border-primary outline-none transition-colors"></div>
                                        <div><label class="block text-xs font-semibold mb-1">Tanggal Lahir</label><input type="date" id="spmbTanggalLahir" max="2015-12-31" required class="w-full p-2.5 text-sm rounded-xl border bg-white dark:bg-darkCard dark:border-gray-600 focus:border-primary outline-none transition-colors"></div>
                                        <div class="md:col-span-2"><label class="block text-xs font-semibold mb-1">Agama</label>
                                            <select id="spmbAgama" required class="w-full p-2.5 text-sm rounded-xl border bg-white dark:bg-darkCard dark:border-gray-600 focus:border-primary outline-none transition-colors"><option value="">Pilih Agama</option><option value="ISLAM">ISLAM</option><option value="KRISTEN">KRISTEN</option><option value="KATOLIK">KATOLIK</option><option value="HINDU">HINDU</option><option value="BUDDHA">BUDDHA</option><option value="KONGHUCU">KONGHUCU</option></select>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="bg-white/50 dark:bg-black/20 p-5 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm">
                                    <h3 class="font-bold text-primaryDark dark:text-primary mb-4 flex items-center gap-2"><i class="ph ph-users-three text-lg"></i> DATA ORANG TUA</h3>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div class="md:col-span-2"><label class="block text-xs font-semibold mb-1">Nama Ibu Kandung</label><input type="text" id="spmbNamaIbu" required class="w-full p-2.5 text-sm rounded-xl border bg-white dark:bg-darkCard dark:border-gray-600 uppercase focus:border-primary outline-none transition-colors"></div>
                                        <div class="md:col-span-2"><label class="block text-xs font-semibold mb-1">Alamat (Jalan/Dusun)</label><input type="text" id="spmbAlamatOrtu" required class="w-full p-2.5 text-sm rounded-xl border bg-white dark:bg-darkCard dark:border-gray-600 uppercase focus:border-primary outline-none transition-colors"></div>
                                        <div><label class="block text-xs font-semibold mb-1">Desa/Kelurahan</label><input type="text" id="spmbDesaOrtu" required class="w-full p-2.5 text-sm rounded-xl border bg-white dark:bg-darkCard dark:border-gray-600 uppercase focus:border-primary outline-none transition-colors"></div>

        window.handleRegisterBaru = async (e) => {
            e.preventDefault();
            const formElement = e.target; const btnSubmit = document.getElementById('btnSubmitFormBaru');
            const nisn = document.getElementById('spmbNisn').value; if (nisn.length !== 10) return showToast("NISN harus 10 digit!", "error");
            const jur1 = document.getElementById('spmbJurusan1').value; const jur2 = document.getElementById('spmbJurusan2').value;
            if (jur1 === jur2 && jur1 !== "") return showToast("Pilihan Jurusan tidak boleh sama!", "error");

            const exists = state.siswa.find(s => s.nisn === nisn);
            if (exists) return showToast(`Data Kembar! NISN terdaftar di No: ${exists.noPendaftaran}`, "error");

            const activeGelombang = state.gelombang.find(g => g.isActive);
            if (!activeGelombang) return showToast("Tidak ada gelombang aktif!", "error");

            btnSubmit.disabled = true; btnSubmit.innerHTML = "Memproses...";

            // Penundaan acak (0.5 - 1 detik) untuk memberi waktu sinkronisasi Firebase & memecah Race Condition
            await new Promise(r => setTimeout(r, 500 + Math.random() * 500));

            // Kalkulasi ulang nomor pendaftaran tepat sebelum menyimpan
            const existingNums = state.siswa.map(s => parseInt(s.noPendaftaran)).filter(n => !isNaN(n));
            const nextNum = Math.max(existingNums.length > 0 ? Math.max(...existingNums) : 0, parseInt(activeGelombang.startId) || 1000) + 1;
            const noPendaftaran = nextNum.toString();
            
            // Verifikasi Final: Pastikan benar-benar tidak ada yang memakai nomor ini
            if (state.siswa.find(s => s.noPendaftaran === noPendaftaran)) {
                btnSubmit.disabled = false; btnSubmit.innerHTML = "Kirim Formulir Pendaftaran";
                return showToast("Sistem sedang sibuk memproses pendaftar lain. Silakan klik Kirim sekali lagi.", "error");

            const toUpper = (str) => str ? str.toUpperCase() : '';

            const newSiswa = {
                noPendaftaran, gelombangId: null, gelombangName: null, 
                asalSekolah: toUpper(document.getElementById('spmbAsalSekolah').value), provSekolah: toUpper(document.getElementById('spmbProvSekolah').value), kabSekolah: toUpper(document.getElementById('spmbKabSekolah').value), kecSekolah: toUpper(document.getElementById('spmbKecSekolah').value),
                name: toUpper(document.getElementById('spmbName').value), nisn: nisn, jk: document.getElementById('spmbJk').value, nik: document.getElementById('spmbNik').value, tempatLahir: toUpper(document.getElementById('spmbTempatLahir').value), tanggalLahir: document.getElementById('spmbTanggalLahir').value, agama: document.getElementById('spmbAgama').value,
                namaIbu: toUpper(document.getElementById('spmbNamaIbu').value), alamatOrtu: toUpper(document.getElementById('spmbAlamatOrtu').value), desaOrtu: toUpper(document.getElementById('spmbDesaOrtu').value), kecOrtu: toUpper(document.getElementById('spmbKecOrtu').value), kabOrtu: toUpper(document.getElementById('spmbKabOrtu').value), provOrtu: toUpper(document.getElementById('spmbProvOrtu').value), hpOrtu: document.getElementById('spmbHpOrtu').value,
                jurusan1: jur1, jurusan2: jur2 || "", guruId: null, checklist1: false, checklist2: false,
                seragam: { putihAbu: false, almamater: false, pramuka: false, olahraga: false, praktik: false, topi: false, sabuk: false, bet: false },
                createdAt: Date.now(), tanggalDaftar: Date.now()
            };

            try {
                const savedId = await saveDoc('siswa', newSiswa); newSiswa.id = savedId;
                formElement.reset(); Array.from(document.getElementById('spmbJurusan2').options).forEach(opt => opt.disabled = false);
                showSuccessRegistration(newSiswa);
            } catch (error) { showToast("Pendaftaran gagal: " + error.message, "error"); } 
            finally { btnSubmit.disabled = false; btnSubmit.innerHTML = "Kirim Formulir Pendaftaran"; }
        };

        window.handleLogin = async (e) => {

                try { await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, pass); state.role = role; }

        window.initAdminCharts = () => {
            const ctxKec = document.getElementById('chartKecamatan'); const ctxJur = document.getElementById('chartJurusan'); const ctxPosJur = document.getElementById('chartPosJurusan'); const ctxGel = document.getElementById('chartGelombang');
            if(!ctxKec || !ctxJur || !ctxPosJur || !ctxGel) return;

            Chart.defaults.color = '#9ca3af'; Chart.defaults.borderColor = 'rgba(255,255,255,0.05)';

            const kecCounts = {}; state.siswa.forEach(s => { if(s.kecOrtu) { const k = s.kecOrtu.toUpperCase(); kecCounts[k] = (kecCounts[k] || 0) + 1; } });
            const sortedKec = Object.entries(kecCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
            
            new Chart(ctxKec, {
                type: 'doughnut',
                data: { labels: sortedKec.map(x=>x[0]), datasets: [{ data: sortedKec.map(x=>x[1]), backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'right', labels: { boxWidth: 12 } } } }
            });

            const gelLabels = ['Pendaftar (Belum)', ...state.gelombang.map(g => window.getAcronym(g.name))];
            const gelData = [
                state.siswa.filter(s => !s.checklist2).length,
                ...state.gelombang.map(g => state.siswa.filter(s => s.checklist2 && s.gelombangId === g.id).length)
            ];
            
            new Chart(ctxGel, {
                type: 'bar',
                data: { labels: gelLabels, datasets: [{ label: 'Jumlah Siswa', data: gelData, backgroundColor: ['#f59e0b', '#3b82f6', '#10b981', '#8b5cf6'], borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });

            const jurLabels = state.jurusan.map(j => window.getAcronym(j.name));
            const posJurData = state.jurusan.map(j => state.siswa.filter(s => s.checklist2 && s.jurusan1 === j.id).length);

            new Chart(ctxPosJur, {
                type: 'bar',
                data: { labels: jurLabels, datasets: [{ label: 'Lunas', data: posJurData, backgroundColor: '#8b5cf6', borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });

            const l = state.siswa.filter(s => s.jk === 'Laki-laki').length; const p = state.siswa.filter(s => s.jk === 'Perempuan').length;
            new Chart(ctxJur, {
                type: 'doughnut',

                options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } } }
            });
        };
