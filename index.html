        // ==========================================
        // AKSI ADMIN (GELOMBANG, JURUSAN, GURU, SISWA, PENGATURAN)
        // ==========================================
        window.editGelombang = (id) => {
            const modal = document.getElementById('modal-gel');
            if (!modal) return;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            if (id) {
                const g = state.gelombang.find(x => x.id === id);
                if (g) {
                    document.getElementById('gelId').value = g.id;
                    document.getElementById('gelName').value = g.name || '';
                    document.getElementById('gelStartId').value = g.startId || '';
                    document.getElementById('gelWa').value = g.waLink || '';
                    document.getElementById('gelActive').checked = !!g.isActive;
                }
            } else {
                document.getElementById('formGel').reset();
                document.getElementById('gelId').value = '';
            }
        };

        window.saveGelombang = async (e) => {
            e.preventDefault();
            const id = document.getElementById('gelId').value;
            const name = document.getElementById('gelName').value.trim();
            const startId = parseInt(document.getElementById('gelStartId').value) || 1000;
            const waLink = document.getElementById('gelWa').value.trim();
            const isActive = document.getElementById('gelActive').checked;

            try {
                if (isActive) {
                    for (const g of state.gelombang) {
                        if (g.id !== id && g.isActive) {
                            await saveDoc('gelombang', { isActive: false }, g.id);
                        }
                    }
                }
                const payload = { name, startId, waLink, isActive };
                await saveDoc('gelombang', payload, id || null);
                closeModal('modal-gel');
                showToast("Gelombang berhasil disimpan!");
            } catch (err) {
                showToast("Gagal menyimpan gelombang: " + err.message, "error");
            }
        };

        window.saveJurusan = async (e) => {
            e.preventDefault();
            const id = document.getElementById('jurEditId').value;
            const name = document.getElementById('newJurName').value.trim().toUpperCase();
            if (!name) return;
            try {
                await saveDoc('jurusan', { name }, id || null);
                document.getElementById('jurEditId').value = '';
                document.getElementById('newJurName').value = '';
                showToast(id ? "Jurusan diperbarui!" : "Jurusan ditambahkan!");
            } catch (err) {
                showToast("Gagal menyimpan jurusan: " + err.message, "error");
            }
        };

        window.saveGuru = async (e) => {
            e.preventDefault();
            const name = document.getElementById('newGuruName').value.trim().toUpperCase();
            if (!name) return;
            try {
                await saveDoc('guru', { name });
                document.getElementById('newGuruName').value = '';
                showToast("Data guru ditambahkan!");
            } catch (err) {
                showToast("Gagal menyimpan data guru: " + err.message, "error");
            }
        };

        window.viewGuruDetails = (guruId) => {
            const g = state.guru.find(x => x.id === guruId);
            if (!g) return;
            const list = state.siswa.filter(s => s.guruId === guruId).sort((a, b) => (parseInt(a.noPendaftaran) || 0) - (parseInt(b.noPendaftaran) || 0));
            const modal = document.getElementById('modal-guru-details');
            const nameEl = document.getElementById('guru-details-name');
            const listEl = document.getElementById('guru-details-list');
            if (!modal || !nameEl || !listEl) return;

            nameEl.innerText = `${g.name} — Total ${list.length} Siswa Referal`;
            listEl.innerHTML = list.length === 0
                ? `<div class="text-center py-8 text-gray-500 text-sm">Belum ada siswa yang menggunakan referal guru ini.</div>`
                : list.map((s, idx) => {
                    const jur = state.jurusan.find(j => j.id === s.jurusan1)?.name || '-';
                    return `
                        <div class="bg-gray-900 border border-gray-800 p-3.5 rounded-2xl flex items-center justify-between gap-3">
                            <div class="min-w-0">
                                <div class="font-bold text-white text-sm truncate">${idx + 1}. ${s.name} <span class="text-xs font-mono text-gray-400">(#${s.noPendaftaran})</span></div>
                                <div class="text-xs text-gray-400 mt-0.5 truncate">${s.asalSekolah || '-'} • ${window.getAcronym(jur)}</div>
                            </div>
                            <span class="shrink-0 text-[10px] font-bold uppercase px-2.5 py-1 rounded-lg ${s.checklist2 ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/15 text-amber-400 border border-amber-500/30'}">${s.checklist2 ? 'Lunas' : 'Pendaftar'}</span>
                        </div>
                    `;
                }).join('');

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.editSiswaAdmin = (id) => {
            const s = state.siswa.find(x => x.id === id);
            if (!s) return showToast("Data siswa tidak ditemukan", "error");

            const existing = document.getElementById('modal-edit-siswa-admin');
            if (existing) existing.remove();

            const jurOptions = state.jurusan.map(j => `<option value="${j.id}" ${s.jurusan1 === j.id ? 'selected' : ''}>${j.name}</option>`).join('');
            const jur2Options = state.jurusan.map(j => `<option value="${j.id}" ${s.jurusan2 === j.id ? 'selected' : ''}>${j.name}</option>`).join('');
            const guruOptions = `<option value="">-- Tanpa Guru Referal --</option>` + state.guru.map(g => `<option value="${g.id}" ${s.guruId === g.id ? 'selected' : ''}>${g.name}</option>`).join('');

            const overlay = document.createElement('div');
            overlay.id = 'modal-edit-siswa-admin';
            overlay.className = 'fixed inset-0 bg-black/80 flex items-center justify-center z-[99999999] px-4 backdrop-blur-sm';
            overlay.innerHTML = `
                <div class="bg-[#111827] border border-gray-800 p-5 sm:p-7 rounded-3xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl relative text-gray-200">
                    <button type="button" onclick="document.getElementById('modal-edit-siswa-admin').remove()" class="absolute top-5 right-5 text-gray-400 hover:text-red-400 bg-gray-900 p-2 rounded-full transition-colors"><i class="ph ph-x text-xl"></i></button>
                    <h3 class="font-black text-xl sm:text-2xl text-white mb-1">Edit Data Siswa</h3>
                    <p class="text-xs text-emerald-400 font-mono mb-4">No Pendaftaran: ${s.noPendaftaran}</p>
                    <form onsubmit="window.saveEditSiswaAdmin(event, '${s.id}')" class="overflow-y-auto custom-scroll pr-1 space-y-4 text-xs sm:text-sm">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">No Pendaftaran</label><input type="text" id="ed_noPendaftaran" value="${s.noPendaftaran || ''}" required class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white font-mono"></div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">Nama Lengkap</label><input type="text" id="ed_name" value="${s.name || ''}" required class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white uppercase"></div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">NISN (10 Digit)</label><input type="text" id="ed_nisn" value="${s.nisn || ''}" required class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white"></div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">NIK (16 Digit)</label><input type="text" id="ed_nik" value="${s.nik || ''}" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white"></div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">Jenis Kelamin</label>
                                <select id="ed_jk" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white">
                                    <option value="Laki-laki" ${s.jk === 'Laki-laki' ? 'selected' : ''}>Laki-laki</option>
                                    <option value="Perempuan" ${s.jk === 'Perempuan' ? 'selected' : ''}>Perempuan</option>
                                </select>
                            </div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">Agama</label><input type="text" id="ed_agama" value="${s.agama || ''}" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white uppercase"></div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">Tempat Lahir</label><input type="text" id="ed_tempatLahir" value="${s.tempatLahir || ''}" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white uppercase"></div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">Tanggal Lahir</label><input type="date" id="ed_tanggalLahir" value="${s.tanggalLahir || ''}" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white"></div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">Asal Sekolah</label><input type="text" id="ed_asalSekolah" value="${s.asalSekolah || ''}" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white uppercase"></div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">Kecamatan Sekolah</label><input type="text" id="ed_kecSekolah" value="${s.kecSekolah || ''}" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white uppercase"></div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">Nama Ibu Kandung</label><input type="text" id="ed_namaIbu" value="${s.namaIbu || ''}" required class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white uppercase"></div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">No. HP Orang Tua</label><input type="text" id="ed_hpOrtu" value="${s.hpOrtu || ''}" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white"></div>
                            <div class="sm:col-span-2"><label class="block text-xs font-bold text-gray-400 mb-1">Alamat Orang Tua</label><input type="text" id="ed_alamatOrtu" value="${s.alamatOrtu || ''}" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white uppercase"></div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">Desa / Kelurahan Ortu</label><input type="text" id="ed_desaOrtu" value="${s.desaOrtu || ''}" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white uppercase"></div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">Kecamatan Ortu</label><input type="text" id="ed_kecOrtu" value="${s.kecOrtu || ''}" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white uppercase"></div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">Pilihan Jurusan 1</label><select id="ed_jurusan1" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white">${jurOptions}</select></div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1">Pilihan Jurusan 2</label><select id="ed_jurusan2" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white">${jur2Options}</select></div>
                            <div class="sm:col-span-2"><label class="block text-xs font-bold text-emerald-400 mb-1">Guru Referal</label><select id="ed_guruId" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white">${guruOptions}</select></div>
                        </div>
                        <div class="flex gap-3 pt-4 border-t border-gray-800">
                            <button type="button" onclick="document.getElementById('modal-edit-siswa-admin').remove()" class="flex-1 py-3 bg-gray-800 hover:bg-gray-700 text-white rounded-xl font-bold">Batal</button>
                            <button type="submit" class="flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold shadow-lg shadow-emerald-500/20">Simpan Perubahan</button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(overlay);
        };

        window.saveEditSiswaAdmin = async (e, id) => {
            e.preventDefault();
            const toUpper = (v) => v ? v.replace(/\s+/g, ' ').trim().toUpperCase() : '';
            const payload = {
                noPendaftaran: document.getElementById('ed_noPendaftaran').value.trim(),
                name: toUpper(document.getElementById('ed_name').value),
                nisn: document.getElementById('ed_nisn').value.trim(),
                nik: document.getElementById('ed_nik').value.trim(),
                jk: document.getElementById('ed_jk').value,
                agama: toUpper(document.getElementById('ed_agama').value),
                tempatLahir: toUpper(document.getElementById('ed_tempatLahir').value),
                tanggalLahir: document.getElementById('ed_tanggalLahir').value,
                asalSekolah: toUpper(document.getElementById('ed_asalSekolah').value),
                kecSekolah: toUpper(document.getElementById('ed_kecSekolah').value),
                namaIbu: toUpper(document.getElementById('ed_namaIbu').value),
                hpOrtu: document.getElementById('ed_hpOrtu').value.trim(),
                alamatOrtu: toUpper(document.getElementById('ed_alamatOrtu').value),
                desaOrtu: toUpper(document.getElementById('ed_desaOrtu').value),
                kecOrtu: toUpper(document.getElementById('ed_kecOrtu').value),
                jurusan1: document.getElementById('ed_jurusan1').value,
                jurusan2: document.getElementById('ed_jurusan2').value,
                guruId: document.getElementById('ed_guruId').value || null
            };
            try {
                await saveDoc('siswa', payload, id);
                const modal = document.getElementById('modal-edit-siswa-admin');
                if (modal) modal.remove();
                showToast("Data siswa berhasil diperbarui!");
            } catch (err) {
                showToast("Gagal memperbarui data: " + err.message, "error");
            }
        };

        window.saveInfoBoardSettings = async (e) => {
            e.preventDefault();
            const isActive = document.getElementById('info_active').checked;
            const title = document.getElementById('info_title').value.trim();
            const content = document.getElementById('info_content').value.trim();
            const infoBoard = { isActive, title, content, updatedAt: Date.now() };
            try {
                state.settings.infoBoard = infoBoard;
                await saveDoc('settings', { infoBoard }, 'main');
                showToast("Papan Informasi berhasil dipublikasikan!");
            } catch (err) {
                showToast("Gagal menyimpan Papan Informasi: " + err.message, "error");
            }
        };

        window.saveGlobalSettings = async (e) => {
            e.preventDefault();
            const waLinkGlobal = document.getElementById('stf_wa_global').value.trim();
            try {
                state.settings.waLinkGlobal = waLinkGlobal;
                await saveDoc('settings', { waLinkGlobal }, 'main');
                showToast("Link Grup WhatsApp berhasil disimpan!");
            } catch (err) {
                showToast("Gagal menyimpan pengaturan: " + err.message, "error");
            }
        };

        window.saveStaffAccount = async (e, role) => {
            e.preventDefault();
            const user = document.getElementById(`stf_${role}_user`).value.trim();
            const pass = document.getElementById(`stf_${role}_pass`).value.trim();
            if (!user || !pass) return showToast("Username dan password wajib diisi!", "error");
            try {
                const updatedStaff = {
                    ...state.settings.staffAccounts,
                    [role]: { user, pass }
                };
                state.settings.staffAccounts = updatedStaff;
                await saveDoc('settings', { staffAccounts: updatedStaff }, 'main');
                showToast(`Akun ${role.replace('_', ' ').toUpperCase()} berhasil diperbarui!`);
            } catch (err) {
                showToast("Gagal menyimpan akun staf: " + err.message, "error");
            }
        };

        window.batalLunas = async (id) => {
            const s = state.siswa.find(x => x.id === id);
            const ok = await window.showConfirmModal({
                title: 'Batalkan Status Lunas?',
                message: `Status lunas siswa <b>${s ? s.name : ''}</b> akan dibatalkan dan dikembalikan ke daftar Pendaftar (Belum Lunas).`,
                confirmText: 'Ya, Batalkan',
                type: 'danger'
            });
            if(ok) {
                try {
                    if (s) { s.checklist2 = false; s.gelombangId = null; s.gelombangName = null; s.waktuLunas = null; render(); }
                    await saveDoc('siswa', { checklist2: false, gelombangId: null, gelombangName: null, waktuLunas: null }, id); showToast("Status lunas dibatalkan");
                } catch(e) { showToast("Gagal", "error"); }
            }
        };

        window.instantPrintPendaftaran = () => { 
            const s = window._tempPrintSiswa; 
            if (!s) return showToast("Data cetak tidak ditemukan", "error"); 
            const cleanName = (s.name || 'Siswa').replace(/[^a-zA-Z0-9]/g, '_');
            window._printContent(window.generatePdfPendaftaran(s), false, `Bukti_Pendaftaran_${s.noPendaftaran}_${cleanName}`); 
        };
        window.instantPrintPendaftaranFromDash = () => { 
            const s = state.siswa.find(x => x.id === state.siswaId); 
            if (!s) return; 
            const cleanName = (s.name || 'Siswa').replace(/[^a-zA-Z0-9]/g, '_');
            window._printContent(window.generatePdfPendaftaran(s), false, `Bukti_Pendaftaran_${s.noPendaftaran}_${cleanName}`); 
        };
        window.printSiswaAdmin = (id) => { 
            const s = state.siswa.find(x => x.id === id); 
            if (!s) return showToast("Data siswa tidak ditemukan", "error"); 
            const cleanName = (s.name || 'Siswa').replace(/[^a-zA-Z0-9]/g, '_');
            window._printContent(window.generatePdfPendaftaran(s), false, `Bukti_Pendaftaran_${s.noPendaftaran}_${cleanName}`); 
        };
        window.printSeragamAdmin = (id) => { 
            const s = state.siswa.find(x => x.id === id); 
            if (!s) return showToast("Data siswa tidak ditemukan", "error"); 
            const cleanName = (s.name || 'Siswa').replace(/[^a-zA-Z0-9]/g, '_');
            window._printContent(window.generatePdfSeragam(s), false, `Bukti_Seragam_${s.noPendaftaran}_${cleanName}`); 
        };

        initAuthAndData();
    </script>
</body>
</html>
